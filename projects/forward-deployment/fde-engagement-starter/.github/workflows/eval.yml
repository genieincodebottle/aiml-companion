# Evaluation gate
#
# Read this before you wonder why CI is red.
#
# On a fresh clone this workflow FAILS, on purpose. The golden set has 12 cases
# across 3 failure modes and the gate requires 30 across 5. That red X is the
# first honest signal the repository gives you.
#
# Watch it fail. Then make it pass. A gate you only ever saw green proves
# nothing about your system: it proves you never tested the gate. If you cannot
# describe what a failing run looks like, you do not know whether the thing that
# is supposed to stop bad changes actually stops anything.
#
# Nothing here needs an API key. The eval runs the offline HeuristicJudge, which
# is deliberate: a gate that requires egress is a gate that will not run inside
# the customer's network, which is exactly where you need it most.

name: eval-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: projects/forward-deployment/fde-engagement-starter

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/forward-deployment/fde-engagement-starter/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Cheap syntax gate. Catches the class of error that would otherwise show
      # up as a confusing pytest collection failure ten steps later.
      - name: Byte-compile everything
        run: python -m compileall -q src customer eval tests deploy

      # continue-on-error is deliberate and temporary-by-design.
      #
      # tests/ IS the rubric, and on a fresh clone most of it fails because src/
      # is a skeleton you have not written yet. Hard-failing here would mask the
      # eval gate below, and the eval gate is the signal that tells you what to
      # do first. So the tests report without blocking.
      #
      # This is scaffolding for a learner, not a pattern to copy. In a real
      # engagement, a permanently non-blocking test step is how a suite rots
      # into decoration. Once your rubric is green, delete this line and let the
      # tests block like they should.
      - name: Run the rubric (non-blocking until you implement src/)
        continue-on-error: true
        run: pytest tests/ -v --tb=short

      # THE BLOCKING GATE. This one decides whether the PR is mergeable.
      #
      # Exit 1 means a threshold in eval/thresholds.yaml was not met. Read the
      # COVERAGE lines first: a quality score over 12 cases is an anecdote, not
      # a measurement, so widening the golden set comes before tuning anything.
      #
      # Exit 2 means the harness itself could not run - malformed YAML, a
      # missing required field, a duplicate case id. That is a broken harness,
      # not a failing system, and it is fixed differently.
      - name: Evaluation gate (BLOCKING)
        run: python eval/run_eval.py --json

      - name: Explain a red gate
        if: failure()
        run: |
          echo "The evaluation gate failed. If this is a fresh clone, that is"
          echo "the expected result and the message above says exactly why."
          echo ""
          echo "Work it in this order:"
          echo "  1. COVERAGE  - extend eval/golden_set.yaml from customer/tickets.jsonl"
          echo "                 to 30+ cases across all 5 failure modes."
          echo "  2. QUALITY   - then, and only then, look at faithfulness,"
          echo "                 precision, and recall."
          echo "  3. THRESHOLDS- if you change a number in eval/thresholds.yaml,"
          echo "                 write the ADR that defends it in the same PR."
          echo ""
          echo "Lowering a threshold to turn CI green, with no ADR, is the one"
          echo "move that makes this whole harness worthless."
