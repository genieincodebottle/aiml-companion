# Scale on queue depth, not CPU. The queue is the signal that a GPU server is behind;
# CPU on a GPU server says almost nothing, and GPU utilisation says "busy", not "behind".
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: engine-sim
  namespace: serving
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: engine-sim
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Pods
      pods:
        metric:
          name: vllm_num_requests_waiting
        target:
          type: AverageValue
          averageValue: "4"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 120
