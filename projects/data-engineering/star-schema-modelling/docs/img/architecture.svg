<svg font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 900 716" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="From generator to scored report. conf/config.yaml with seed 42 drives data/world.py, the seeded generator. It writes five raw CSV files to data/raw, customer_changes, orders, order_lines, products and product_corrections, and separately writes the answer key to data/answer_key, true_revenue.json, true_shipping.json and trap_ledger.json. The raw files load into DuckDB as text in schema raw. dbt staging has 5 stg models that cast types, rename columns and remove re-sent rows. The marts are dim_product, Type 1 with 400 rows, fct_order_line with one row per line and 29,902 rows, dim_customer, Type 2 with 1,950 rows, and fct_order with one row per order and 12,000 rows. Both facts join dim_customer, finding the version by validity window, and fct_order_line also joins dim_product by product_id. The reports are rpt_revenue_by_region_category_day with 5,372 cells, built from fct_order_line joined to dim_customer and dim_product, and rpt_shipping_by_region_day with 905 cells, built from fct_order joined to dim_customer. The reports join the dimensions on customer_sk and product_sk. The scorer, evaluation/answer_key.py and scoring.py, compares both reports to the answer key in exact Decimal. The answer key is never read by the build. The correct model scores 0.00 error, with 0 wrong cells of 5,372 for revenue and 0 of 905 for shipping. For each of the 13 breaks, variants.py edits a copy of the dbt project in artifacts/work and runs the same build.">
  <defs>
    <marker id="ssArr" viewBox="0 0 10 10" refX="0.32" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5 L0,9 z" fill="#64748B"/>
    </marker></defs>
  
    <style>
      text { fill: #1E293B; }
