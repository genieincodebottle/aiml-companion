  <text x="519" y="527" class="boxSub" text-anchor="middle">905 cells</text>
  <rect x="34" y="574" width="832" height="58" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
  <text x="54" y="598" class="boxTitle">Scorer</text>
  <text x="54" y="618" class="boxSub">evaluation/answer_key.py and scoring.py, exact Decimal comparison</text>
  <rect x="656" y="586" width="192" height="34" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.4"/>
  <text x="752" y="608" class="tag" text-anchor="middle" style="fill:#166534;font-size:12px">0.00 error, 0 wrong cells</text>
