  <rect x="363" y="372" width="128.5" height="64" rx="10" fill="#CFFAFE" stroke="#0891B2" stroke-width="1.5"/>
  <text x="427.25" y="394" class="boxTitle" text-anchor="middle">dim_customer</text>
  <text x="427.25" y="412" class="boxSub" text-anchor="middle">Type 2</text>
  <text x="427.25" y="427" class="boxSub" text-anchor="middle">1,950 rows</text>
  <rect x="527.5" y="372" width="128.5" height="64" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="591.75" y="394" class="boxTitle" text-anchor="middle">fct_order</text>
  <text x="591.75" y="412" class="boxSub" text-anchor="middle">one row per order</text>
