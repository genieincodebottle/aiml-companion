[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "star-schema-modelling"
version = "1.0.0"
description = "A dbt star schema with planted traps, an answer key and a mutation matrix"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12,<2", "dbt-duckdb>=1.11", "duckdb>=2.0", "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.2"]
notebook = ["jupyter>=1.1", "nbformat>=5.11", "nbconvert>=7.17", "ipykernel>=7.4", "matplotlib>=3.11", "pandas>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Find the package without requiring `pip install -e .`. The editable install
# fails on some Windows setups, and the suite should not depend on it.
pythonpath = ["src"]
