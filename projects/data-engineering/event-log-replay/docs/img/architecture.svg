<svg font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="From generated log to scored sink. The consumer reads only the log, and the answer key goes to the scorer and nowhere else. config.yaml with seed 20261006 drives data/generate.py, which writes the stream with its planted faults and, separately, answer_key.json in data/, the true balances and profiles. The log is topic wallet_events, 51,000 records in 3 partitions, with 16,638, 16,771 and 17,591 records, and the offset is the line index. The consumer, runner.py, polls 100 records at a time, round robin across partitions, and is killed 52 times, about once per 997 records per partition. It commits to the committed offsets store, one file per consumer group, and a restarted consumer reads its position from there. The consumer writes to the DuckDB sink, with tables balances, profiles, processed_events and, in the atomic sinks, consumer_offsets. The sink is kept through crashes. The scorer, evaluation/score.py, is the only reader of the answer key. It compares balances and profiles with the answer key to the cent and prints the scoreboard and the profile table. The log is a set of files by default, or Redpanda v24.2.7 through log/kafkalog.py, and both give identical scoreboard, replay and batch results. A crash restarts the consumer from its committed offset and leaves the DuckDB sink as it was.">
  <defs>
    <marker id="rlArr" viewBox="0 0 10 10" refX="0.32" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5 L0,9 z" fill="#64748B"/>
    </marker>
    <marker id="rlArrBad" viewBox="0 0 10 10" refX="0.32" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5 L0,9 z" fill="#DC2626"/>
    </marker></defs>
  
    <style>
      text { fill: #1E293B; }
      .title { font-size: 25px; font-weight: 800; fill: #0F172A; }
      .subtitle { font-size: 13px; fill: #475569; letter-spacing: 0.2px; }
      .layerLabel { font-size: 12px; font-weight: 700; fill: #334155; letter-spacing: 1.6px; }
      .boxTitle { font-size: 14.5px; font-weight: 700; }
      .boxSub { font-size: 11.5px; fill: #475569; }
      .tag { font-size: 11px; font-weight: 600; letter-spacing: 0.3px; }
      .note { font-size: 11.5px; fill: #475569; }
      .num { font-size: 13px; font-weight: 800; fill: #0F172A; }
      .big { font-size: 28px; font-weight: 800; fill: #0F172A; }
      .flowMain { fill: none; stroke: #94A3B8; stroke-width: 2.5; }
      .flowGood { fill: none; stroke: #16A34A; stroke-width: 2.2; }
      .flowBad { fill: none; stroke: #DC2626; stroke-width: 2.2; }
      .guard { fill: none; stroke: #7C3AED; stroke-width: 1.6; stroke-dasharray: 5 4; }
    </style>
  <rect width="900" height="700" fill="#F8FAFC"/>
  <text x="34" y="42" class="title">From generated log to scored sink</text>
  <text x="34" y="64" class="subtitle">The consumer reads only the log. The answer key goes to the scorer and nowhere else.</text>
  <line x1="680" y1="84" x2="680" y2="552" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="34" y="100" class="layerLabel">LOG, CONSUMER AND SINK</text>
  <text x="700" y="100" class="layerLabel">ANSWER KEY</text>
  <rect x="34" y="112" width="140" height="50" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="104" y="133" class="boxTitle" text-anchor="middle">config.yaml</text>
  <text x="104" y="151" class="boxSub" text-anchor="middle">seed 20261006</text>
  <rect x="204" y="112" width="170" height="50" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="289" y="133" class="boxTitle" text-anchor="middle">data/generate.py</text>
  <text x="289" y="151" class="boxSub" text-anchor="middle">stream and planted faults</text>
  <rect x="696" y="112" width="170" height="78" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="781" y="135" class="boxTitle" text-anchor="middle">answer_key.json</text>
  <text x="781" y="156" class="boxSub" text-anchor="middle">true balances and profiles</text>
  <text x="781" y="173" class="boxSub" text-anchor="middle">in data/</text>
  <rect x="34" y="194" width="358" height="114" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="54" y="217" class="boxTitle">Log, topic wallet_events</text>
  <text x="54" y="236" class="boxSub">51,000 records in 3 partitions, offset = line index</text>
  <text x="54" y="261" class="tag" style="fill:#334155">P0</text>
  <rect x="80" y="251" width="208.08" height="12" rx="3" fill="#BFDBFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="372" y="261.5" class="boxSub" text-anchor="end" style="fill:#1E293B;font-weight:700">16,638</text>
  <text x="54" y="279" class="tag" style="fill:#334155">P1</text>
  <rect x="80" y="269" width="209.74" height="12" rx="3" fill="#BFDBFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="372" y="279.5" class="boxSub" text-anchor="end" style="fill:#1E293B;font-weight:700">16,771</text>
  <text x="54" y="297" class="tag" style="fill:#334155">P2</text>
  <rect x="80" y="287" width="220" height="12" rx="3" fill="#BFDBFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="372" y="297.5" class="boxSub" text-anchor="end" style="fill:#1E293B;font-weight:700">17,591</text>
  <rect x="34" y="342" width="358" height="92" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="54" y="365" class="boxTitle">Consumer, runner.py</text>
  <text x="54" y="384" class="boxSub">polls 100 records, round robin across partitions</text>
  <rect x="54" y="397" width="318" height="24" rx="6" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
  <text x="213" y="413" class="tag" text-anchor="middle" style="fill:#991B1B">52 crashes, about 1 per 997 records per partition</text>
  <circle cx="392" cy="342" r="10" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="388" y1="338" x2="396" y2="346" stroke="#FFFFFF" stroke-width="2.2"/>
  <line x1="388" y1="346" x2="396" y2="338" stroke="#FFFFFF" stroke-width="2.2"/>
  <rect x="500" y="342" width="156" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="578" y="366" class="boxTitle" text-anchor="middle" style="font-size:13px">Committed offsets</text>
  <text x="578" y="387" class="boxSub" text-anchor="middle">one file per</text>
  <text x="578" y="403" class="boxSub" text-anchor="middle">consumer group</text>
  <rect x="34" y="470" width="622" height="66" rx="10" fill="#CFFAFE" stroke="#0891B2" stroke-width="1.5"/>
  <text x="54" y="494" class="boxTitle">DuckDB sink</text>
  <text x="54" y="516" class="boxSub" style="fill:#334155">balances, profiles, processed_events, consumer_offsets (atomic sinks)</text>
  <rect x="500" y="480" width="140" height="24" rx="6" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.2"/>
  <text x="570" y="496" class="tag" text-anchor="middle" style="fill:#166534">kept through crashes</text>
  <rect x="34" y="576" width="832" height="58" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="1.6"/>
  <text x="54" y="600" class="boxTitle">Scorer, evaluation/score.py</text>
  <text x="54" y="620" class="boxSub">compares balances and profiles with the answer key, to the cent</text>
  <rect x="650" y="590" width="200" height="30" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.4"/>
  <text x="750" y="610" class="tag" text-anchor="middle" style="fill:#166534;font-size:12px">scoreboard and profile table</text>
  <path d="M174,137 L197.06 137" class="flowMain" marker-end="url(#rlArr)"/>
  <path d="M374,137 L689.06 137" class="flowMain" marker-end="url(#rlArr)"/>
  <path d="M289,162 L289 187.06" class="flowMain" marker-end="url(#rlArr)"/>
  <path d="M213,308 L213 335.06" class="flowMain" marker-end="url(#rlArr)"/>
  <text x="221" y="330" class="boxSub">poll</text>
  <path d="M392,368 L493.06 368" class="flowMain" marker-end="url(#rlArr)"/>
  <text x="446" y="360" class="boxSub" text-anchor="middle">commit</text>
  <path d="M500,410 L398.94 410" class="flowMain" marker-end="url(#rlArr)"/>
  <text x="446" y="428" class="boxSub" text-anchor="middle">read on restart</text>
  <path d="M213,434 L213 463.06" class="flowMain" marker-end="url(#rlArr)"/>
  <text x="221" y="456" class="boxSub">write</text>
  <path d="M345,536 L345 569.06" class="flowMain" marker-end="url(#rlArr)"/>
  <path d="M726,190 L726 569.06" class="flowMain" marker-end="url(#rlArr)"/>
  <text x="738" y="374" class="boxSub">read only by</text>
  <text x="738" y="391" class="boxSub">evaluation/score.py</text>
  <text x="34" y="662" class="note">The log is a set of files by default, or Redpanda v24.2.7 through log/kafkalog.py. Both give identical scoreboard, replay and batch results.</text>
  <text x="34" y="681" class="note">A crash restarts the consumer from its committed offset and leaves the DuckDB sink as it was.</text>
</svg>
