# Single-node Redpanda (Kafka API compatible). Optional: only the `--backend kafka` path needs it.
#
#   docker compose up -d
#   export KAFKA_BOOTSTRAP=localhost:19092     (PowerShell: $env:KAFKA_BOOTSTRAP = "localhost:19092")
#   python run.py produce --backend kafka
#   python run.py compare --backend kafka
#   docker compose down
#
# Host port 19092 is used on purpose, so a Kafka already listening on 9092 is not disturbed.
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --mode=dev-container
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20
