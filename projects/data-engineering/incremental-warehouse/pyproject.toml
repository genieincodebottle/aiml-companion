[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incremental-warehouse"
version = "1.0.0"
description = "An incremental warehouse pipeline that survives late commits, deletes, reruns and bad input"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0", "pyarrow>=26.0", "PyYAML>=6.0", "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.2"]
notebook = ["pandas>=3.1", "matplotlib>=3.11", "nbformat>=5.11", "nbconvert>=7.17", "ipykernel>=7.4", "pip"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Find the package without requiring `pip install -e .`. The editable install
# fails on some Windows setups, and the suite should not depend on it.
pythonpath = ["src"]
