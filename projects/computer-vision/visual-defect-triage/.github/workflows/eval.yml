name: evaluate

on:
  pull_request:
    paths:
      - 'projects/computer-vision/visual-defect-triage/**'

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/computer-vision/visual-defect-triage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The demo path is numpy only, so CI does not install torch.
      - name: Install
        run: pip install numpy pydantic pydantic-settings PyYAML pytest

      - name: Tests
        run: python -m pytest tests/ -q

      # The gate that matters is the slice regression, not overall accuracy.
      # A candidate can gain half a point overall while losing four on the class
      # the customer cares about, and an average-only check waves it through.
      - name: Pipeline and slice gate
        run: |
          python -m scripts.make_synthetic_data
          python -m src.run_pipeline
          python -m scripts.check_slices --max-regression 0.02
