[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-defect-triage"
version = "1.0.0"
description = "A ViT backbone, a calibrated confidence gate, and a review loop that pays for its own labels"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
model = ["torch>=2.15", "torchvision>=0.29", "timm>=1.0", "pillow>=13.0"]
retrieval = ["faiss-cpu>=1.16"]
serve = ["fastapi>=0.162", "uvicorn>=0.54", "python-multipart>=0.0.33"]
dev = ["pytest>=9.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Import src/ without requiring an editable install, which fails on some Windows
# setups with a stale entry-point exe. The suite should not depend on that.
pythonpath = ["."]
