<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-label="A drift band whose width follows rater disagreement"><title>A drift band whose width follows rater disagreement</title><defs></defs><rect width="940" height="430" fill="#fbfbfd"/><text x="470.0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#12141a" text-anchor="middle" font-weight="600">Phase IV: the threshold floats</text><text x="470.0" y="56" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#12141a" text-anchor="middle" font-weight="400">judge  &gt;=  mean(raters)  -  2 x sd(raters)</text><text x="470.0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6270" text-anchor="middle" font-weight="400">Same judge score in both panels. One passes, one fails - and that is correct.</text><rect x="42" y="104" width="400" height="220" rx="8" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.2"/><text x="242" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#12141a" text-anchor="middle" font-weight="600">Unanimous raters  (sd = 0)</text><text x="242" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle" font-weight="400">nobody found this week ambiguous</text><rect x="102" y="200" width="280" height="22" fill="#d93025" opacity="0.10"/><line x1="102" y1="200" x2="382" y2="200" stroke="#5b6270" stroke-width="1.4" stroke-dasharray="4 3"/><text x="394" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5b6270" text-anchor="start" font-weight="400">mean</text><line x1="102" y1="222" x2="382" y2="222" stroke="#d93025" stroke-width="1.8"/><text x="394" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#d93025" text-anchor="start" font-weight="400">floor</text><circle cx="242" cy="238" r="6" fill="#12141a"/><text x="242" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#12141a" text-anchor="middle" font-weight="600">judge</text><text x="242" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d93025" text-anchor="middle" font-weight="600">OUT OF BAND  -  alert</text><rect x="498" y="104" width="400" height="220" rx="8" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.2"/><text x="698" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#12141a" text-anchor="middle" font-weight="600">Raters disagreed  (sd large)</text><text x="698" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle" font-weight="400">a genuinely hard week</text><rect x="558" y="200" width="280" height="76" fill="#0f9d58" opacity="0.10"/><line x1="558" y1="200" x2="838" y2="200" stroke="#5b6270" stroke-width="1.4" stroke-dasharray="4 3"/><text x="850" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5b6270" text-anchor="start" font-weight="400">mean</text><line x1="558" y1="276" x2="838" y2="276" stroke="#0f9d58" stroke-width="1.8"/><text x="850" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0f9d58" text-anchor="start" font-weight="400">floor</text><circle cx="698" cy="238" r="6" fill="#12141a"/><text x="698" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#12141a" text-anchor="middle" font-weight="600">judge</text><text x="698" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0f9d58" text-anchor="middle" font-weight="600">IN BAND  -  no alert</text><line x1="42" y1="348" x2="898" y2="348" stroke="#c9ccd4" stroke-width="1"/><text x="470.0" y="374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#12141a" text-anchor="middle" font-weight="400">A hard week widens sd, which widens the band: the judge is not punished for finding hard what people also found hard.</text><text x="470.0" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6270" text-anchor="middle" font-weight="400">A FIXED threshold fails both ways - it fires every hard week until somebody mutes it, then sleeps through a slow slide on easy ones.</text><text x="470.0" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#b26a00" text-anchor="middle" font-weight="600">The spread between raters is not noise to average away. It is the input.</text></svg>