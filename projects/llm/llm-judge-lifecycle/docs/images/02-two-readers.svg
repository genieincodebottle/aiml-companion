<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-label="One rubric read by both an LLM judge and a rule engine"><title>One rubric read by both an LLM judge and a rule engine</title><defs><marker id="ar-green" viewBox="0 0 9 9" refX="8" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0.6 L 9 4.5 L 0 8.4 z" fill="#0f9d58"/></marker><marker id="ar-purple" viewBox="0 0 9 9" refX="8" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0.6 L 9 4.5 L 0 8.4 z" fill="#7c3aed"/></marker></defs><rect width="940" height="430" fill="#fbfbfd"/><text x="470.0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#12141a" text-anchor="middle" font-weight="600">One rubric, two readers</text><text x="470.0" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6270" text-anchor="middle" font-weight="400">The same file is prose for a model and rules for a deterministic engine.</text><rect x="250" y="82" width="440" height="104" rx="8" fill="#ffffff" stroke="#12141a" stroke-width="1.8"/><text x="470.0" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6270" text-anchor="middle" font-weight="400">rubric  (domains/&lt;name&gt;/domain.yaml)</text><text x="266" y="132" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#12141a" text-anchor="start" font-weight="400">- Reject filler that would fit any item.</text><text x="266" y="152" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="400">  [banned: "you'll love it", "a must-watch"]</text><text x="266" y="172" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#12141a" text-anchor="start" font-weight="400">- Claims must be traceable. [grounded]</text><line x1="360" y1="192" x2="210" y2="236" stroke="#0f9d58" stroke-width="1.4" marker-end="url(#ar-green)"/><line x1="580" y1="192" x2="730" y2="236" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#ar-purple)"/><rect x="60" y="244" width="300" height="108" rx="8" fill="#ffffff" stroke="#0f9d58" stroke-width="1.8"/><text x="210" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#0f9d58" text-anchor="middle" font-weight="600">LLM judge</text><text x="210" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#12141a" text-anchor="middle" font-weight="400">reads the sentences,</text><text x="210" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#12141a" text-anchor="middle" font-weight="400">ignores the brackets</text><text x="210" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle" font-weight="400">catches paraphrase - and costs money</text><rect x="580" y="244" width="300" height="108" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/><text x="730" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#7c3aed" text-anchor="middle" font-weight="600">rule engine  (src/rules.py)</text><text x="730" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#12141a" text-anchor="middle" font-weight="400">reads the brackets,</text><text x="730" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#12141a" text-anchor="middle" font-weight="400">ignores the sentences</text><text x="730" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle" font-weight="400">free, exact, and cannot read</text><line x1="60" y1="376" x2="880" y2="376" stroke="#c9ccd4" stroke-width="1"/><text x="470.0" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#12141a" text-anchor="middle" font-weight="400">So the offline run is a real BASELINE, not a mock - and RART's optimiser edits text that both readers obey.</text><text x="470.0" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle" font-weight="400">Measured live: the Pro reflector added a prose clause AND a tag, improving both readers at once.</text></svg>