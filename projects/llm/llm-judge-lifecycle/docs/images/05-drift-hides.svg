<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-label="Drift visible only when new items are checked separately"><title>Drift visible only when new items are checked separately</title><defs></defs><rect width="940" height="400" fill="#fbfbfd"/><text x="470.0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#12141a" text-anchor="middle" font-weight="600">Where drift hides</text><text x="470.0" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6270" text-anchor="middle" font-weight="400">Week 6 of the shipped scenario: the aggregate is healthy and the judge is broken.</text><rect x="60" y="100" width="500" height="62" rx="8" fill="#ffffff" stroke="#0f9d58" stroke-width="1.8"/><text x="80" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0f9d58" text-anchor="start" font-weight="600">Established catalogue</text><text x="80" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#12141a" text-anchor="start" font-weight="400">10 failures, judge caught 10</text><text x="576" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="start" font-weight="400">the judge is still good here</text><rect x="60" y="176" width="500" height="62" rx="8" fill="#ffffff" stroke="#d93025" stroke-width="1.8"/><text x="80" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d93025" text-anchor="start" font-weight="600">Recently added titles</text><text x="80" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#12141a" text-anchor="start" font-weight="400">4 failures, judge caught 1</text><text x="576" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="start" font-weight="400">new subject matter it was never tuned on</text><rect x="60" y="262" width="400" height="62" rx="8" fill="#ffffff" stroke="#0f9d58" stroke-width="1.8"/><text x="260" y="286" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#12141a" text-anchor="middle" font-weight="400">OVERALL   specificity 0.786  vs  floor 0.624</text><text x="260" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f9d58" text-anchor="middle" font-weight="600">IN BAND  -  no alert</text><rect x="490" y="262" width="400" height="62" rx="8" fill="#ffffff" stroke="#d93025" stroke-width="1.8"/><text x="690" y="286" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#12141a" text-anchor="middle" font-weight="400">NEW ITEMS  specificity 0.250  vs  floor 0.681</text><text x="690" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#d93025" text-anchor="middle" font-weight="600">OUT OF BAND  -  alert</text><text x="470.0" y="356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#12141a" text-anchor="middle" font-weight="400">Ten right verdicts outweigh three wrong ones, so a monitor watching only the aggregate files this as a normal week.</text><text x="470.0" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="600">check_new_items_separately: true   -   one line of config, and the only reason this is visible.</text></svg>