<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-label="The judge as gate and critic, with a bounded retry budget"><title>The judge as gate and critic, with a bounded retry budget</title><defs><marker id="ar-ink" viewBox="0 0 9 9" refX="8" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0.6 L 9 4.5 L 0 8.4 z" fill="#12141a"/></marker><marker id="ar-green" viewBox="0 0 9 9" refX="8" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0.6 L 9 4.5 L 0 8.4 z" fill="#0f9d58"/></marker><marker id="ar-red" viewBox="0 0 9 9" refX="8" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0.6 L 9 4.5 L 0 8.4 z" fill="#d93025"/></marker><marker id="ar-purple" viewBox="0 0 9 9" refX="8" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0.6 L 9 4.5 L 0 8.4 z" fill="#7c3aed"/></marker></defs><rect width="940" height="400" fill="#fbfbfd"/><text x="470.0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#12141a" text-anchor="middle" font-weight="600">Phase III: one judge, two roles</text><text x="470.0" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6270" text-anchor="middle" font-weight="400">It rejects (gate), and its reason becomes the writer's next instruction (critic).</text><rect x="48" y="110" width="150" height="70" rx="8" fill="#ffffff" stroke="#12141a" stroke-width="1.4"/><text x="123" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#12141a" text-anchor="middle" font-weight="600">record</text><text x="123" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle" font-weight="400">the subject</text><rect x="248" y="110" width="150" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><text x="323" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="600">generator</text><text x="323" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle" font-weight="400">writes a draft</text><rect x="448" y="110" width="168" height="70" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/><text x="532" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="600">judge</text><text x="532" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle" font-weight="400">one per criterion</text><rect x="700" y="76" width="190" height="62" rx="8" fill="#ffffff" stroke="#0f9d58" stroke-width="1.8"/><text x="795" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#0f9d58" text-anchor="middle" font-weight="600">SERVE</text><text x="795" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle" font-weight="400">passed every gate</text><rect x="700" y="186" width="190" height="62" rx="8" fill="#ffffff" stroke="#d93025" stroke-width="1.8"/><text x="795" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#d93025" text-anchor="middle" font-weight="600">DROP</text><text x="795" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle" font-weight="400">budget exhausted</text><line x1="200" y1="145" x2="242" y2="145" stroke="#12141a" stroke-width="1.4" marker-end="url(#ar-ink)"/><line x1="400" y1="145" x2="442" y2="145" stroke="#12141a" stroke-width="1.4" marker-end="url(#ar-ink)"/><path d="M 618 132 C 660 132, 660 102, 696 102" fill="none" stroke="#0f9d58" stroke-width="1.4" marker-end="url(#ar-green)"/><path d="M 618 160 C 660 160, 660 214, 696 214" fill="none" stroke="#d93025" stroke-width="1.4" marker-end="url(#ar-red)"/><path d="M 532 184 C 532 250, 323 250, 323 186" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#ar-purple)"/><text x="428" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="600">the rejection REASON is the revision instruction   (K retries)</text><line x1="48" y1="316" x2="892" y2="316" stroke="#c9ccd4" stroke-width="1"/><text x="470.0" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#12141a" text-anchor="middle" font-weight="600">The asymmetry is one `if`, and it is the whole design:</text><text x="470.0" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#12141a" text-anchor="middle" font-weight="400">a bad artefact served reaches a user and cannot be recalled   -   a good one dropped costs one opportunity</text><text x="470.0" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle" font-weight="400">This is also why a right-verdict-wrong-reason rejection is a real defect: it steers the rewrite at the wrong problem.</text></svg>