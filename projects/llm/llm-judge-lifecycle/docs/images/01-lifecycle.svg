<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-label="The four phases of an LLM judge lifecycle"><title>The four phases of an LLM judge lifecycle</title><defs><marker id="ar-ink" viewBox="0 0 9 9" refX="8" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0.6 L 9 4.5 L 0 8.4 z" fill="#12141a"/></marker><marker id="ar-red" viewBox="0 0 9 9" refX="8" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0.6 L 9 4.5 L 0 8.4 z" fill="#d93025"/></marker><marker id="ar-green" viewBox="0 0 9 9" refX="8" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0.6 L 9 4.5 L 0 8.4 z" fill="#0f9d58"/></marker></defs><rect width="940" height="430" fill="#fbfbfd"/><text x="470.0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#12141a" text-anchor="middle" font-weight="600">The lifecycle of an LLM judge</text><text x="470.0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6270" text-anchor="middle" font-weight="400">Not a benchmark score. A service that is built, tuned, deployed and kept aligned.</text><rect x="42" y="146" width="196" height="100" rx="8" fill="#ffffff" stroke="#0f9d58" stroke-width="1.8"/><text x="140.0" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#0f9d58" text-anchor="middle" font-weight="600">I  BIRTH</text><text x="140.0" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#12141a" text-anchor="middle" font-weight="400">a labelled benchmark</text><text x="140.0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#12141a" text-anchor="middle" font-weight="400">with human rationales</text><line x1="243" y1="196.0" x2="255" y2="196.0" stroke="#12141a" stroke-width="1.4" marker-end="url(#ar-ink)"/><rect x="262" y="146" width="196" height="100" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/><text x="360.0" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#7c3aed" text-anchor="middle" font-weight="600">II  TRAINING</text><text x="360.0" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#12141a" text-anchor="middle" font-weight="400">RART: the RUBRIC</text><text x="360.0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#12141a" text-anchor="middle" font-weight="400">is the parameter</text><line x1="463" y1="196.0" x2="475" y2="196.0" stroke="#12141a" stroke-width="1.4" marker-end="url(#ar-ink)"/><rect x="482" y="146" width="196" height="100" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><text x="580.0" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2563eb" text-anchor="middle" font-weight="600">III  DEPLOYMENT</text><text x="580.0" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#12141a" text-anchor="middle" font-weight="400">gate + critic,</text><text x="580.0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#12141a" text-anchor="middle" font-weight="400">DROP on failure</text><line x1="683" y1="196.0" x2="695" y2="196.0" stroke="#12141a" stroke-width="1.4" marker-end="url(#ar-ink)"/><rect x="702" y="146" width="196" height="100" rx="8" fill="#ffffff" stroke="#b26a00" stroke-width="1.8"/><text x="800.0" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#b26a00" text-anchor="middle" font-weight="600">IV  MONITORING</text><text x="800.0" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#12141a" text-anchor="middle" font-weight="400">a band pegged to</text><text x="800.0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#12141a" text-anchor="middle" font-weight="400">human disagreement</text><text x="470.0" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#0f9d58" text-anchor="middle" font-weight="600">SLOW LOOP    each week's rated sample is appended to the benchmark</text><path d="M 800.0 139 C 800.0 104, 140.0 104, 140.0 139" fill="none" stroke="#0f9d58" stroke-width="1.5" marker-end="url(#ar-green)" stroke-dasharray="5 4"/><path d="M 800.0 253 C 800.0 300, 360.0 300, 360.0 253" fill="none" stroke="#d93025" stroke-width="1.5" marker-end="url(#ar-red)"/><text x="470.0" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#d93025" text-anchor="middle" font-weight="600">FAST LOOP    drift detected -&gt; re-tune, staged for a human</text><line x1="42" y1="358" x2="898" y2="358" stroke="#c9ccd4" stroke-width="1"/><text x="470.0" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#12141a" text-anchor="middle" font-weight="400">Phase IV is the one teams defer, and the only one that tells you the other three have stopped working.</text><text x="470.0" y="406" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle" font-weight="400">A judge aligned on the day it ships will not stay aligned: the catalogue moves, the generator moves, and so does the meaning of good.</text></svg>