[project]
name = "muse-glimmer-lab"
version = "0.1.0"
description = "A hands-on lab for Meta's Muse Glimmer 30B: channel-scoped output, ATEM tool calls, KV-cache maths, and a DFlash block-diffusion speculative-decoding simulator. Runs with no GPU."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Rajesh Srivastava" }]
keywords = [
    "muse-glimmer", "meta", "agentic-ai", "speculative-decoding", "dflash",
    "block-diffusion", "gguf", "llama-cpp", "quantization", "local-inference",
]

# Deliberately tiny. The offline mode that every script defaults to needs
# nothing but the standard library, so a learner with no GPU and no patience
# for a dependency tree can still run every experiment.
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glimmer"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
