# ============================================================
# RAG Pipeline Configuration
# Base settings for the production RAG Expert Assistant
# ============================================================

# Document processing
chunking:
  chunk_size: 512
  chunk_overlap: 50
  separators:
    - "\n\n"
    - "\n"
    - ". "
    - " "

# Embedding model. This block IS read at runtime (src/rag_pipeline.py ::
# get_embeddings) and passed to the embedder as output_dimensionality.
# gemini-embedding-001 returns 3072 dims by default, so 3072 matches the
# shipped index. Changing it requires deleting chroma_db/ and re-indexing.
# embedding and reranker are read at runtime; the other sections are reference
# values (the code carries its own defaults).
embedding:
  model: "models/gemini-embedding-001"
  dimensions: 3072

# Vector store
vectorstore:
  provider: "chromadb"
  collection_name: "product_docs"
  persist_directory: "./chroma_db"

# Retrieval settings
retrieval:
  top_k_retrieval: 20
  top_k_rerank: 5
  search_type: "similarity"

# Reranker (runs locally, no API key needed). This block IS read at runtime
# (src/rag_pipeline.py :: load_reranker_config -> build_retriever). Every published
# score was measured with ms-marco-MultiBERT-L-12, FlashRank's default, so it is
# pinned here; changing it changes every reranked score, so re-run eval and ab.
reranker:
  model: "ms-marco-MultiBERT-L-12"
  provider: "flashrank"

# LLM generation
# No temperature: Google marks temperature/top_p/top_k as deprecated and ignored
# for Gemini 3.5 models (future models reject them with HTTP 400).
llm:
  model: "gemini-3.5-flash-lite"
  max_tokens: 1024

# Evaluation thresholds
evaluation:
  faithfulness_threshold: 0.85
  relevancy_threshold: 0.80
  precision_threshold: 0.70
  recall_threshold: 0.70

# Security
security:
  enable_pii_detection: true
  enable_injection_defense: true
  enable_output_filtering: true
