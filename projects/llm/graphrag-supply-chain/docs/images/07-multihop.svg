"11.5" fill="#12141a" text-anchor="start">Each edge lives in a DIFFERENT source: the incident bulletin names only the city, the sub-tier dossier names only</text><text x="54.0" y="436.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#12141a" text-anchor="start">Formosa&#x27;s customer, the supplier profile names only the laminate, and the bill of materials is a CSV. The chain is</text><text x="54.0" y="453.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#12141a" text-anchor="start">never written down anywhere, which is exactly what the 2026 mapping report says in its own words.</text><rect x="34.0" y="490.0" width="912.0" height="86.0" rx="8" fill="#f4fbf6" stroke="#0f9d58" stroke-width="1.4"/><text x="54.0" y="514.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f9d58" text-anchor="start" font-weight="600">Measured on the golden set (12 questions x 5 strategies)</text><text x="54.0" y="536.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#12141a" text-anchor="start">multi-hop questions - evidence recall:        hybrid 1.00   classic RAG 1.00   vector-only 0.75</text><text x="54.0" y="552.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#12141a" text-anchor="start">multi-hop questions - answer term coverage:   hybrid 1.00   classic RAG 0.47   vector-only 0.40</text></svg>