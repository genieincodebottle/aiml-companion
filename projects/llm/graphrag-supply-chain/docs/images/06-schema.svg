th="2.0"/><text x="110.0" y="312.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#12141a" text-anchor="middle" font-weight="600">:Chunk</text><text x="110.0" y="328.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#5b6270" text-anchor="middle">text, vector</text><circle cx="360.0" cy="204.0" r="54.0" fill="#f4fbf6" stroke="#0f9d58" stroke-width="2.0"/><text x="360.0" y="200.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#12141a" text-anchor="middle" font-weight="600">:Supplier</text><text x="360.0" y="216.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#5b6270" text-anchor="middle">name, aliases</text><circle cx="360.0" cy="378.0" r="50.0" fill="#f4fbf6" stroke="#0f9d58" stroke-width="2.0"/><text x="360.0" y="374.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#12141a" text-anchor="middle" font-weight="600">:Location</text><text x="360.0" y="390.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#5b6270" text-anchor="middle">name</text><circle cx="610.0" cy="378.0" r="50.0" fill="#fff5f5" stroke="#d92d20" stroke-width="2.0"/><text x="610.0" y="374.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#12141a" text-anchor="middle" font-weight="600">:Finding</text><text x="610.0" y="390.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#5b6270" text-anchor="middle">status</text><circle cx="610.0" cy="204.0" r="54.0" fill="#f4fbf6" stroke="#0f9d58" stroke-width="2.0"/><text x="610.0" y="200.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#12141a" text-anchor="middle" font-weight="600">:Component</text><text x="610.0" y="216.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#5b6270" text-anchor="middle">name</text><circle cx="846.0" cy="204.0" r="52.0" fill="#f4fbf6" stroke="#0f9d58" stroke-width="2.0"/><text x="846.0" y="200.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#12141a" text-anchor="middle" font-weight="600">:Product</text><text x="846.0" y="216.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#5b6270" text-anchor="middle">name</text><line x1="110.0" y1="196.0" x2="110.0" y2="259.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-2563eb)"/><text x="97.0" y="237.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#2563eb" text-anchor="middle">:PART_OF</text><line x1="153.8" y1="296.4" x2="302.5" y2="229.8" stroke="#7c3aed" stroke-width="2.0" marker-end="url(#arrow-7c3aed)"/><text x="240.3" y="275.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#7c3aed" text-anchor="middle">:MENTIONS</text><line x1="156.6" y1="327.6" x2="302.7" y2="363.8" stroke="#7c3aed" stroke-width="2.0" marker-end="url(#arrow-7c3aed)"/><text x="231.9" y="363.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#7c3aed" text-anchor="middle">:MENTIONS</text><line x1="414.0" y1="204.0" x2="547.0" y2="204.0" stroke="#0f9d58" stroke-width="1.6" marker-end="url(#arrow-0f9d58)"/><text x="485.0" y="221.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#0f9d58" text-anchor="middle">:SUPPLIES</text><line x1="794.0" y1="204.0" x2="673.0" y2="204.0" stroke="#0f9d58" stroke-width="1.6" marker-end="url(#arrow-0f9d58)"/><text x="728.0" y="195.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#0f9d58" text-anchor="middle">:CONTAINS</text><line x1="360.0" y1="258.0" x2="360.0" y2="319.0" stroke="#0f9d58" stroke-width="1.6" marker-end="url(#arrow-0f9d58)"/><text x="347.0" y="295.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#0f9d58" text-anchor="middle">:LOCATED_IN</text><line x1="569.0" y1="349.4" x2="411.7" y2="240.0" stroke="#d92d20" stroke-width="1.6" marker-end="url(#arrow-d92d20)"/><text x="492.4" y="284.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#d92d20" text-anchor="middle">:RAISED_AGAINST</text><path d="M 330 158 C 276 88 444 88 384 154" fill="none" stroke="#0f9d58" stroke-width="1.8" marker-end="url(#arrow-0f9d58)"/><text x="360.0" y="100.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f9d58" text-anchor="middle" font-weight="600">:DEPENDS_ON</text><text x="360.0" y="116.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#5b6270" text-anchor="middle">tier 2 and deeper</text><rect x="34.0" y="450.0" width="448.0" height="92.0" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.4"/><text x="54.0" y="474.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="600">The bridge, in one relationship</text><text x="54.0" y="498.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#12141a" text-anchor="start">(:Chunk)-[:MENTIONS]-&gt;(:Entity)</text><text x="54.0" y="522.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#5b6270" text-anchor="start">Forwards it turns a vector hit into anchors. Backwards it turns a traversal into quotable text.</text><rect x="498.0" y="450.0" width="448.0" height="92.0" rx="8" fill="#ffffff" stroke="#c9cedb" stroke-width="1.4"/><text x="518.0" y="474.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#12141a" text-anchor="start" font-weight="600">Every entity carries TWO labels: (:Entity:Supplier)</text><text x="518.0" y="498.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#12141a" text-anchor="start">:Entity  one constraint, one full-text index, one generic traversal.</text><text x="518.0" y="513.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#12141a" text-anchor="start">:Supplier  is an index the planner scans. A property filter is not.</text></svg>