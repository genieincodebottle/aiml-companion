.5" fill="#0f9d58" text-anchor="start">:OPERATES</text><line x1="852.0" y1="258.0" x2="852.0" y2="290.0" stroke="#0f9d58" stroke-width="1.3" marker-end="url(#arrow-0f9d58)"/><text x="852.0" y="280.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#0f9d58" text-anchor="start">:LOCATED_IN</text><line x1="535.0" y1="228.0" x2="782.0" y2="164.0" stroke="#0f9d58" stroke-width="1.3" marker-end="url(#arrow-0f9d58)"/><text x="650.0" y="212.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#0f9d58" text-anchor="middle">:RAISED_AGAINST</text><line x1="540.0" y1="306.0" x2="598.0" y2="154.0" stroke="#0f9d58" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-0f9d58)"/><text x="566.0" y="244.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#0f9d58" text-anchor="middle">:APPLIES_TO</text><line x1="733.0" y1="308.0" x2="782.0" y2="304.0" stroke="#0f9d58" stroke-width="1.3" marker-end="url(#arrow-0f9d58)"/><text x="760.0" y="328.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#0f9d58" text-anchor="middle">:AFFECTS</text><path d="M 908 140 q 34 -22 34 8 q 0 26 -30 16" fill="none" stroke="#0f9d58" stroke-width="1.6" stroke-dasharray="5 3"/><text x="900.0" y="116.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#0f9d58" text-anchor="end">:DEPENDS_ON  (tier 2/3)</text><rect x="36.0" y="290.0" width="300.0" height="76.0" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.4"/><text x="186.0" y="316.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="600">THE BRIDGE</text><text x="186.0" y="340.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#12141a" text-anchor="middle">(:Chunk)-[:MENTIONS]-&gt;(:Entity)</text><line x1="186.0" y1="244.0" x2="186.0" y2="286.0" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-7c3aed)"/><line x1="336.0" y1="328.0" x2="430.0" y2="284.0" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-7c3aed)"/><rect x="36.0" y="414.0" width="908.0" height="84.0" rx="8" fill="#ffffff" stroke="#c9cedb" stroke-width="1.4"/><text x="56.0" y="438.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#12141a" text-anchor="start" font-weight="600">Every entity carries TWO labels: (:Entity:Supplier)</text><text x="56.0" y="460.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#12141a" text-anchor="start">:Entity  gives one uniqueness constraint, one full-text index and one generic traversal across all ten types.</text><text x="56.0" y="476.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#12141a" text-anchor="start">:Supplier  is an index the planner can scan - WHERE n.type = &#x27;Supplier&#x27; is not.</text></svg>