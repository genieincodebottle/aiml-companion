<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-label="Ingestion: documents and ERP exports into Neo4j"><title>Ingestion: documents and ERP exports into Neo4j</title><defs><marker id="arrow-0f9d58" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f9d58"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker><marker id="arrow-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker></defs><rect width="980" height="560" fill="#fbfbfd"/><text x="490.0" y="32.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#12141a" text-anchor="middle" font-weight="600">4. Ingestion: two sources, treated differently</text><text x="490.0" y="54.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6270" text-anchor="middle">Not everything belongs in an LLM extractor</text><rect x="36.0" y="86.0" width="430.0" height="176.0" rx="8" fill="#fffaf2" stroke="#d97706" stroke-width="1.4"/><text x="251.0" y="111.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#d97706" text-anchor="middle" font-weight="600">STRUCTURED  (ERP / PLM export)</text><text x="251.0" y="134.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#5b6270" text-anchor="middle">products.csv, components.csv, bom.csv,</text><text x="251.0" y="150.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#5b6270" text-anchor="middle">suppliers.csv, sites.csv, supplies.csv</text><rect x="70.0" y="170.0" width="362.0" height="72.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/><text x="251.0" y="192.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#12141a" text-anchor="middle" font-weight="600">Loaded verbatim. No LLM.</text><text x="251.0" y="212.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5b6270" text-anchor="middle">provenance = &#x27;erp&#x27;,  confidence = 1.0</text><text x="251.0" y="227.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5b6270" text-anchor="middle">Already structured, governed and correct.</text><rect x="514.0" y="86.0" width="430.0" height="176.0" rx="8" fill="#f4fbf6" stroke="#0f9d58" stroke-width="1.4"/><text x="729.0" y="111.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f9d58" text-anchor="middle" font-weight="600">UNSTRUCTURED  (documents)</text><text x="729.0" y="134.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">audit reports, supplier questionnaires,</text><text x="729.0" y="150.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">incident bulletins, regulatory notices</text><rect x="548.0" y="170.0" width="362.0" height="72.0" rx="6" fill="#ffffff" stroke="#0f9d58" stroke-width="1.4"/><text x="729.0" y="192.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#12141a" text-anchor="middle" font-weight="600">Guardrail -&gt; chunk -&gt; LLM extract</text><text x="729.0" y="212.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5b6270" text-anchor="middle">provenance = &#x27;llm&#x27;,  confidence + evidence quote</text><text x="729.0" y="227.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5b6270" text-anchor="middle">Tier-2/3 dependencies no ERP has.</text><rect x="230.0" y="294.0" width="520.0" height="92.0" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/><text x="490.0" y="318.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="600">Entity resolution  (deterministic, no model)</text><text x="490.0" y="340.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">1. normalised exact match   2. alias lookup   3. guarded fuzzy match</text><text x="490.0" y="356.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">ERP names are registered FIRST, so they win every identity contest</text><line x1="251.0" y1="262.0" x2="330.0" y2="290.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#arrow-d97706)"/><line x1="729.0" y1="262.0" x2="650.0" y2="290.0" stroke="#0f9d58" stroke-width="1.6" marker-end="url(#arrow-0f9d58)"/><rect x="230.0" y="418.0" width="520.0" height="112.0" rx="8" fill="#f7f9ff" stroke="#2563eb" stroke-width="1.4"/><text x="490.0" y="444.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="600">Neo4j</text><text x="490.0" y="468.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">constraints + range indexes  |  VECTOR index on (:Chunk).embedding</text><text x="490.0" y="484.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">FULLTEXT on (:Entity).name + aliases  |  FULLTEXT on (:Chunk).text</text><text x="490.0" y="501.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">one store for embeddings AND relationships - no cross-database join key</text><line x1="490.0" y1="386.0" x2="490.0" y2="414.0" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrow-7c3aed)"/><text x="490.0" y="554.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#12141a" text-anchor="middle">Deciding which facts belong on which side of that line is the central design judgement.</text></svg>