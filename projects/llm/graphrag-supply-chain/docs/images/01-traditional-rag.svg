<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-label="Traditional RAG: retrieval by similarity only"><title>Traditional RAG: retrieval by similarity only</title><defs><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><rect width="940" height="400" fill="#fbfbfd"/><text x="470.0" y="32.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#12141a" text-anchor="middle" font-weight="600">1. Traditional RAG</text><text x="470.0" y="54.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6270" text-anchor="middle">One hop: the question finds text that looks like the answer</text><rect x="40.0" y="92.0" width="200.0" height="96.0" rx="8" fill="#ffffff" stroke="#12141a" stroke-width="1.4"/><text x="140.0" y="115.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#12141a" text-anchor="middle" font-weight="600">Question</text><text x="140.0" y="134.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">&quot;Which products are&quot;</text><text x="140.0" y="150.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">&quot;exposed to Kaohsiung?&quot;</text><rect x="250.0" y="92.0" width="200.0" height="96.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="350.0" y="115.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="600">Embed</text><text x="350.0" y="134.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">one vector,</text><text x="350.0" y="150.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">768 dimensions</text><rect x="460.0" y="92.0" width="200.0" height="96.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/><text x="560.0" y="115.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="600">Vector search</text><text x="560.0" y="134.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">top-k nearest chunks</text><text x="560.0" y="150.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">by cosine similarity</text><rect x="670.0" y="92.0" width="200.0" height="96.0" rx="8" fill="#ffffff" stroke="#12141a" stroke-width="1.4"/><text x="770.0" y="115.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#12141a" text-anchor="middle" font-weight="600">LLM</text><text x="770.0" y="134.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">answer from</text><text x="770.0" y="150.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">those k chunks</text><line x1="240.0" y1="140.0" x2="250.0" y2="140.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-2563eb)"/><line x1="450.0" y1="140.0" x2="460.0" y2="140.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-2563eb)"/><line x1="660.0" y1="140.0" x2="670.0" y2="140.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-2563eb)"/><rect x="40.0" y="220.0" width="860.0" height="96.0" rx="8" fill="#fff5f5" stroke="#d92d20" stroke-width="1.4" stroke-dasharray="5 4"/><text x="60.0" y="246.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d92d20" text-anchor="start" font-weight="600">Where it breaks</text><text x="60.0" y="268.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#12141a" text-anchor="start">Retrieval returns text SIMILAR to the question. But no document says which products are exposed to Kaohsiung -</text><text x="60.0" y="284.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#12141a" text-anchor="start">the incident bulletin explicitly declines to say. The answer is a JOIN across five relationships, and a join is not</text><text x="60.0" y="301.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#12141a" text-anchor="start">a similarity. Raising k does not help: the sentence you need does not exist in any chunk, at any rank.</text></svg>