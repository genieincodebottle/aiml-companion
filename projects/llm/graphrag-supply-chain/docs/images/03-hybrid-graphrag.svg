<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-label="Hybrid GraphRAG: vector anchors into graph traversal"><title>Hybrid GraphRAG: vector anchors into graph traversal</title><defs><marker id="arrow-0f9d58" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f9d58"/></marker><marker id="arrow-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs><rect width="980" height="470" fill="#fbfbfd"/><text x="490.0" y="32.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#12141a" text-anchor="middle" font-weight="600">3. Hybrid Graph + Vector RAG</text><text x="490.0" y="54.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6270" text-anchor="middle">Vector search finds where to start; the graph finds what similarity cannot</text><rect x="36.0" y="88.0" width="210.0" height="96.0" rx="8" fill="#ffffff" stroke="#12141a" stroke-width="1.4"/><text x="141.0" y="112.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#12141a" text-anchor="middle" font-weight="600">Question</text><text x="141.0" y="134.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">natural language,</text><text x="141.0" y="150.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">no schema knowledge</text><rect x="36.0" y="218.0" width="300.0" height="106.0" rx="8" fill="#f5f8ff" stroke="#2563eb" stroke-width="1.4"/><text x="186.0" y="242.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="600">Text arm</text><text x="186.0" y="264.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">vector search (semantic)</text><text x="186.0" y="280.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">+ BM25 (exact terms)</text><text x="186.0" y="297.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">fused with RRF</text><rect x="372.0" y="218.0" width="300.0" height="106.0" rx="8" fill="#f4fbf6" stroke="#0f9d58" stroke-width="1.4"/><text x="522.0" y="242.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0f9d58" text-anchor="middle" font-weight="600">Graph arm</text><text x="522.0" y="264.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">entity linking -&gt; traversal</text><text x="522.0" y="280.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">type-driven templates</text><text x="522.0" y="297.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">derived structural facts</text><line x1="141.0" y1="184.0" x2="141.0" y2="214.0" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-2563eb)"/><line x1="180.0" y1="184.0" x2="470.0" y2="214.0" stroke="#0f9d58" stroke-width="1.6" marker-end="url(#arrow-0f9d58)"/><rect x="36.0" y="348.0" width="636.0" height="62.0" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.4"/><text x="354.0" y="372.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#7c3aed" text-anchor="middle" font-weight="600">THE BRIDGE:  (:Chunk)-[:MENTIONS]-&gt;(:Entity)</text><text x="354.0" y="394.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">vector hits become graph anchors; traversal results become quotable chunks</text><line x1="186.0" y1="324.0" x2="186.0" y2="344.0" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arrow-7c3aed)"/><line x1="522.0" y1="324.0" x2="522.0" y2="344.0" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#arrow-7c3aed)"/><rect x="706.0" y="218.0" width="238.0" height="106.0" rx="8" fill="#ffffff" stroke="#12141a" stroke-width="1.4"/><text x="825.0" y="242.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#12141a" text-anchor="middle" font-weight="600">Grounded answer</text><text x="825.0" y="264.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">derived facts first,</text><text x="825.0" y="280.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">then supporting text,</text><text x="825.0" y="297.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6270" text-anchor="middle">every claim cited</text><line x1="672.0" y1="271.0" x2="706.0" y2="271.0" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrow-7c3aed)"/><text x="490.0" y="440.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#12141a" text-anchor="middle">Each arm fails differently. Name matching fails when the question names nothing (&quot;which products are exposed to the typhoon&quot;).</text><text x="490.0" y="456.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#12141a" text-anchor="middle">Vector anchoring fails when similarity lands on the wrong document. Together they are far more robust than either alone.</text></svg>