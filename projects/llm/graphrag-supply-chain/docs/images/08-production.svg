89.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5b6270" text-anchor="middle">per-request budget cap</text><line x1="696.0" y1="253.0" x2="716.0" y2="253.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow-6b7280)"/><rect x="36.0" y="484.0" width="908.0" height="96.0" rx="8" fill="#fffaf2" stroke="#d97706" stroke-width="1.4"/><text x="56.0" y="510.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="start" font-weight="600">Ingestion, scheduled rather than on demand</text><text x="56.0" y="534.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#12141a" text-anchor="start">ERP/PLM change-data-capture -&gt; backbone upsert   |   document queue -&gt; guardrail -&gt; extract -&gt; resolve -&gt; upsert</text><text x="56.0" y="550.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#12141a" text-anchor="start">incremental by document hash  |  human review queue for rejected fuzzy matches and flagged documents</text><text x="56.0" y="567.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#12141a" text-anchor="start">re-embedding is a migration: a new model means a new index, built alongside and swapped, never in place</text></svg>