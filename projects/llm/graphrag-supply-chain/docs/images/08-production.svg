ff" stroke="#d92d20" stroke-width="1.4" stroke-dasharray="5 4"/><text x="376.0" y="114.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d92d20" text-anchor="middle" font-weight="600">Edge</text><text x="376.0" y="134.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5b6270" text-anchor="middle">OIDC / mTLS, WAF</text><text x="376.0" y="149.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5b6270" text-anchor="middle">distributed rate limit</text><line x1="236.0" y1="125.0" x2="276.0" y2="125.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow-6b7280)"/><rect x="276.0" y="194.0" width="420.0" height="118.0" rx="8" fill="#f7f9ff" stroke="#2563eb" stroke-width="1.4"/><text x="486.0" y="220.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2563eb" text-anchor="middle" font-weight="600">FastAPI  -  all business logic</text><text x="486.0" y="242.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5b6270" text-anchor="middle">guardrails (ingest / query / response)  |  retrieval strategies</text><text x="486.0" y="257.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5b6270" text-anchor="middle">prompt construction  |  evaluation  |  audit log</text><text x="486.0" y="273.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5b6270" text-anchor="middle">a control enforced in a frontend is one anyone can skip with curl</text><line x1="376.0" y1="162.0" x2="376.0" y2="190.0" stroke="#d92d20" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-d92d20)"/><rect x="36.0" y="344.0" width="280.0" height="108.0" rx=