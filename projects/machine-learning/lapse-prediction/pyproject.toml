[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lapse-prediction"
version = "1.0.0"
description = "Life-insurance policy lapse and time-to-premium prediction"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1",
    "numpy>=2.5",
    "scipy>=1.18",
    "scikit-learn>=1.9",
    "lightgbm>=4.7",
    "xgboost>=3.4",
    "statsmodels>=0.15",
    "pyarrow>=26.0",
    "joblib>=1.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
neural = ["torch>=2.15"]
dev = ["pytest>=9.2", "pytest-cov>=7.1", "ruff>=0.17"]

[project.scripts]
lapse = "lapse_prediction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: deselect with -m 'not slow'"]
# Test THIS checkout, not whatever `lapse_prediction` happens to be installed.
# Without this line an old `pip install -e .` from a previous location of the
# project keeps a .pth file on sys.path, and the suite silently validates a
# different copy of the source -- green tests, unchanged code. The other three
# projects in this folder already pin it; this one did not, and it was the one
# with the stale install.
pythonpath = ["src"]

[tool.ruff]
line-length = 95
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
