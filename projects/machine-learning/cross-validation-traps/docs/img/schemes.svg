<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="Four validation schemes compared by which rows each one lets the model see, with the measured optimism of each against the truth holdout">
  <style>
    .t  { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .h  { font-size: 13px; font-weight: 700; letter-spacing: .04em; }
    .b  { font-size: 12.5px; font-weight: 600; }
    .n  { font-size: 11.5px; fill: #334155; }
    .s  { font-size: 11px; fill: #64748b; }
    .m  { font-family: Consolas, "Courier New", monospace; font-size: 12.5px; fill: #0f172a; }
    .item  { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 5; }
    .claim { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; rx: 8; }
    .false { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.3; rx: 8; }
    .warn  { fill: #fffbeb; stroke: #d97706; stroke-width: 1.3; rx: 8; }
    .ok    { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.3; rx: 8; }
    .bad   { fill: #fecaca; }
    .good  { fill: #bbf7d0; }
    .none  { fill: #e2e8f0; }
  </style>

  <text class="t h" x="20" y="26">FOUR SCHEMES, ONE PANEL, ONE TRUTH</text>
  <text class="t s" x="20" y="44">Each row shows what the scheme allows, then what it cost. Measured on 7,030 development rows.</text>

  <text class="t s" x="330" y="76">REUSES A CUSTOMER</text>
  <text class="t s" x="500" y="76">TRAINS ON THE FUTURE</text>
  <text class="t s" x="676" y="76">CV AUC</text>
  <text class="t s" x="784" y="76">OPTIMISM</text>

  <rect class="false" x="20" y="86" width="920" height="72"/>
  <text class="t b" x="36" y="110">StratifiedKFold</text>
  <text class="t s" x="36" y="130">the default almost everyone reaches for first</text>
  <rect class="bad" x="330" y="98" width="120" height="26" rx="4"/>
  <text class="t m" x="346" y="116">95% of rows</text>
  <rect class="bad" x="500" y="98" width="140" height="26" rx="4"/>
  <text class="t m" x="516" y="116">28,120 rows</text>
  <text class="t m" x="676" y="116">0.7430</text>
  <text class="t m" x="784" y="116" fill="#b91c1c">+0.0265</text>
  <text class="t s" x="676" y="140">flatters the model by two and a half points</text>

  <rect class="warn" x="20" y="168" width="920" height="72"/>
  <text class="t b" x="36" y="192">Forward chaining</text>
  <text class="t s" x="36" y="212">fixes time, ignores customers</text>
  <rect class="bad" x="330" y="180" width="120" height="26" rx="4"/>
  <text class="t m" x="346" y="198">82% of rows</text>
  <rect class="good" x="500" y="180" width="140" height="26" rx="4"/>
  <text class="t m" x="516" y="198">none</text>
  <text class="t m" x="676" y="198">0.7289</text>
  <text class="t m" x="784" y="198" fill="#b91c1c">+0.0125</text>
  <text class="t s" x="676" y="222">half the error survives: one fix was not enough</text>

  <rect class="ok" x="20" y="250" width="920" height="72"/>
  <text class="t b" x="36" y="274">GroupKFold</text>
  <text class="t s" x="36" y="294">fixes customers, ignores time</text>
  <rect class="good" x="330" y="262" width="120" height="26" rx="4"/>
  <text class="t m" x="346" y="280">none</text>
  <rect class="bad" x="500" y="262" width="140" height="26" rx="4"/>
  <text class="t m" x="516" y="280">yes</text>
  <text class="t m" x="676" y="280">0.7061</text>
  <text class="t m" x="784" y="280" fill="#15803d">-0.0103</text>
  <text class="t s" x="676" y="304">closest to the truth of any scheme here</text>

  <rect class="ok" x="20" y="332" width="920" height="72"/>
  <text class="t b" x="36" y="356">Grouped forward chaining</text>
  <text class="t s" x="36" y="376">both constraints, and the least data</text>
  <rect class="good" x="330" y="344" width="120" height="26" rx="4"/>
  <text class="t m" x="346" y="362">none</text>
  <rect class="good" x="500" y="344" width="140" height="26" rx="4"/>
  <text class="t m" x="516" y="362">none</text>
  <text class="t m" x="676" y="362">0.6896</text>
  <text class="t m" x="784" y="362" fill="#b45309">-0.0269</text>
  <text class="t s" x="676" y="386">overshoots: strictest is not the same as accurate</text>

  <rect class="claim" x="20" y="418" width="920" height="66"/>
  <text class="t b" x="36" y="442">The truth is 0.7165. Nothing lands on it.</text>
  <text class="t n" x="36" y="466">Naive folds are optimistic, strict folds are pessimistic, and the honest report is a range, not a number.</text>
</svg>
