<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Two families of cross-validation trap: structural traps caused by how you split stay constant as the sample grows, while statistical traps caused by how often you look shrink away">
  <style>
    .t  { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .h  { font-size: 13px; font-weight: 700; letter-spacing: .04em; }
    .b  { font-size: 12.5px; font-weight: 600; }
    .n  { font-size: 11.5px; fill: #334155; }
    .s  { font-size: 11px; fill: #64748b; }
    .m  { font-family: Consolas, "Courier New", monospace; font-size: 12px; fill: #0f172a; }
    .item  { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 5; }
    .claim { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; rx: 8; }
    .false { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.3; rx: 8; }
    .ok    { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.3; rx: 8; }
    .axis  { stroke: #94a3b8; stroke-width: 1.2; }
    .grid  { stroke: #e2e8f0; stroke-width: 1; }
    .lineA { stroke: #dc2626; stroke-width: 2.5; fill: none; }
    .lineB { stroke: #d97706; stroke-width: 2.5; fill: none; stroke-dasharray: 6 4; }
    .lineC { stroke: #2563eb; stroke-width: 2.5; fill: none; }
  </style>

  <text class="t h" x="20" y="26">TWO FAMILIES OF TRAP, AND ONLY ONE GOES AWAY</text>
  <text class="t s" x="20" y="44">Self-deception in AUC, measured at five sample sizes on the same panel.</text>

  <!-- plot frame: x 90..640, y 90..330 ; y scale 0 .. 0.20 -->
  <line class="axis" x1="90" y1="330" x2="640" y2="330"/>
  <line class="axis" x1="90" y1="90" x2="90" y2="330"/>

  <line class="grid" x1="90" y1="270" x2="640" y2="270"/>
  <line class="grid" x1="90" y1="210" x2="640" y2="210"/>
  <line class="grid" x1="90" y1="150" x2="640" y2="150"/>

  <text class="t s" x="46" y="334">0.00</text>
  <text class="t s" x="46" y="274">0.05</text>
  <text class="t s" x="46" y="214">0.10</text>
  <text class="t s" x="46" y="154">0.15</text>
  <text class="t s" x="46" y="94">0.20</text>

  <text class="t s" x="76" y="350">205</text>
  <text class="t s" x="200" y="350">412</text>
  <text class="t s" x="330" y="350">823</text>
  <text class="t s" x="452" y="350">1,996</text>
  <text class="t s" x="592" y="350">6,992</text>
  <text class="t s" x="300" y="372">development rows</text>

  <!-- selection leakage: .1800 .1270 .0545 .0261 .0075 -->
  <polyline class="lineA" points="90,114 227,177 364,265 501,299 640,321"/>
  <!-- winner's curse: .0461 .0345 .0207 .0066 .0023 -->
  <polyline class="lineB" points="90,275 227,289 364,305 501,322 640,327"/>
  <!-- customer leakage measured at each size: .0198 .0475 .0505 .0588 .0375 -->
  <polyline class="lineC" points="90,306 227,273 364,269 501,259 640,285"/>

  <circle cx="90" cy="114" r="3.5" fill="#dc2626"/><circle cx="227" cy="177" r="3.5" fill="#dc2626"/>
  <circle cx="364" cy="265" r="3.5" fill="#dc2626"/><circle cx="501" cy="299" r="3.5" fill="#dc2626"/>
  <circle cx="640" cy="321" r="3.5" fill="#dc2626"/>
  <circle cx="90" cy="275" r="3.5" fill="#d97706"/><circle cx="640" cy="327" r="3.5" fill="#d97706"/>
  <circle cx="90" cy="306" r="3.5" fill="#2563eb"/><circle cx="227" cy="273" r="3.5" fill="#2563eb"/>
  <circle cx="364" cy="269" r="3.5" fill="#2563eb"/><circle cx="501" cy="259" r="3.5" fill="#2563eb"/>
  <circle cx="640" cy="285" r="3.5" fill="#2563eb"/>

  <text class="t m" x="120" y="106" fill="#b91c1c">selection fitted before the split</text>
  <text class="t m" x="120" y="266" fill="#b45309">winner's curse, best of 30</text>
  <text class="t m" x="120" y="292" fill="#1d4ed8">customer leakage (group)</text>

  <rect class="false" x="664" y="90" width="276" height="112"/>
  <text class="t b" x="680" y="114">STATISTICAL</text>
  <text class="t s" x="680" y="132">caused by how often you look</text>
  <text class="t n" x="680" y="156">Selection leakage: 0.1800 to 0.0075</text>
  <text class="t n" x="680" y="174">Winner's curse: 0.0461 to 0.0023</text>
  <text class="t s" x="680" y="194">More rows dissolve them.</text>

  <rect class="claim" x="664" y="212" width="276" height="118"/>
  <text class="t b" x="680" y="236">STRUCTURAL</text>
  <text class="t s" x="680" y="254">caused by how you split</text>
  <text class="t n" x="680" y="278">Customer leakage: 0.0198 to 0.0588</text>
  <text class="t n" x="680" y="296">across the same five sizes, with</text>
  <text class="t n" x="680" y="314">no downward trend. It is not noise.</text>

  <rect class="ok" x="20" y="392" width="920" height="72"/>
  <text class="t b" x="36" y="416">Why this matters more than any single number here:</text>
  <text class="t n" x="36" y="440">Most published warnings about preprocessing leakage come from small-n studies. Applied to a large table they are</text>
  <text class="t n" x="36" y="458">nearly harmless advice. The trap that survives your data getting bigger is the one built into how you cut it.</text>
</svg>
