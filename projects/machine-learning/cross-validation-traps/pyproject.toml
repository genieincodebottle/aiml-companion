[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-validation-traps"
version = "1.0.0"
description = "Five ways cross-validation lies to you, each measured against a known truth"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1", "numpy>=2.5", "scipy>=1.18", "scikit-learn>=1.9",
    "pyarrow>=26.0", "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.2", "ruff>=0.17"]
notebook = ["jupyter>=1.1", "matplotlib>=3.11"]

[project.scripts]
cvtraps = "cv_traps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Find the package without requiring `pip install -e .` -- the editable install
# fails on some Windows setups with a stale entry-point .exe, and the test
# suite should not depend on that succeeding.
pythonpath = ["src"]
