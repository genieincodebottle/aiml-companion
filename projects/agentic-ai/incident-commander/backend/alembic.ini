# Alembic configuration for the optional Postgres schema.
#
# You rarely need to run Alembic by hand: the backend applies migrations itself
# at startup (src/db/session.py). The database URL comes from IC_DATABASE_URL,
# not from this file, so no credentials are stored here.
#
#   uv run alembic upgrade head                         # apply migrations
#   uv run alembic revision --autogenerate -m "..."     # after changing src/db/models.py
#   uv run alembic upgrade head --sql                   # print the SQL, no database needed

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
