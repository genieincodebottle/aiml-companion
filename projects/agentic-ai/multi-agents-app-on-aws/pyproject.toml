[project]
name = "multi-agents-app-on-aws"
version = "1.0.0"
description = "Multi-agent AI system on AWS using Bedrock AgentCore"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "Rajesh Srivastava", email = "rajsrivastava2@gmail.com"}]
keywords = ["ai-agents", "aws", "bedrock", "agentcore", "multi-agent"]

dependencies = [
    "boto3>=1.44",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
groq = [
    "groq>=1.7",
]
gemini = [
    "google-genai>=3.3",
]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17",
]
deploy = [
    "bedrock-agentcore>=1.26",
    "bedrock-agentcore-starter-toolkit>=0.3",
]
ui = [
    "streamlit>=1.67",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
