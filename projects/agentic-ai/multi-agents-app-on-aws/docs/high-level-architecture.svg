<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Multi-Agent AI App on AWS - High-Level Architecture</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="900" fill="#ffffff"/>
  <text x="590" y="34" font-size="21" text-anchor="middle" font-weight="700" fill="#111827">Multi-Agent AI App on AWS - High-Level Architecture</text>

  <!-- User and local entry points -->
  <rect x="24" y="58" width="220" height="44" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="134" y="84.75" font-size="13.5" text-anchor="middle" font-weight="600" fill="#9a3412">You (terminal or browser)</text>
  <rect x="24" y="132" width="220" height="200" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="134" y="156" font-size="14.5" text-anchor="middle" font-weight="700" fill="#1d4ed8">Run locally</text>
  <rect x="38" y="168" width="192" height="70" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="134" y="192.5" font-size="13" text-anchor="middle" font-weight="600" fill="#1d4ed8">python -m</text>
  <text x="134" y="207.5" font-size="11" text-anchor="middle" fill="#1e3a8a">agents.orchestrator</text>
  <text x="134" y="222.5" font-size="11" text-anchor="middle" fill="#1e3a8a">--query "..." [--verbose]</text>
  <rect x="38" y="248" width="192" height="70" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="134" y="272.5" font-size="13" text-anchor="middle" font-weight="600" fill="#1d4ed8">streamlit run ui/app.py</text>
  <text x="134" y="287.5" font-size="11" text-anchor="middle" fill="#1e3a8a">imports the orchestrator</text>
  <text x="134" y="302.5" font-size="11" text-anchor="middle" fill="#1e3a8a">and runs it in-process</text>
  <polyline points="134,102 134,130" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- One Python process -->
  <rect x="280" y="132" width="480" height="400" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="520" y="156" font-size="14.5" text-anchor="middle" font-weight="700" fill="#4338ca">One Python process (agents/)</text>
  <rect x="300" y="168" width="440" height="86" rx="6" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="520" y="193" font-size="13" text-anchor="middle" font-weight="600" fill="#4338ca">orchestrator.run()  (agents/orchestrator.py)</text>
  <text x="520" y="208" font-size="11" text-anchor="middle" fill="#3730a3">create_plan(): 1 LLM call returns a JSON plan of 2-4 steps</text>
  <text x="520" y="223" font-size="11" text-anchor="middle" fill="#3730a3">plan does not parse: research, analyst, writer</text>
  <text x="520" y="238" font-size="11" text-anchor="middle" fill="#3730a3">steps run one at a time, at most MAX_AGENT_ITERATIONS (10)</text>
  <rect x="300" y="270" width="440" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="520" y="291" font-size="13" text-anchor="middle" font-weight="600" fill="#334155">call_agent(name, input)</text>
  <text x="520" y="306" font-size="11" text-anchor="middle" fill="#334155">ARN set in AGENT_ARNS: remote call, else the local run()</text>
  <polyline points="520,254 520,268" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
  <polyline points="520,318 520,342" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="528" y="335" font-size="10.5" fill="#374151">one step at a time</text>
  <rect x="300" y="344" width="140" height="64" rx="6" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="370" y="365" font-size="12" text-anchor="middle" font-weight="600" fill="#4338ca">research_agent</text>
  <text x="370" y="380" font-size="11" text-anchor="middle" fill="#3730a3">web_search, then</text>
  <text x="370" y="395" font-size="11" text-anchor="middle" fill="#3730a3">1 LLM call</text>
  <rect x="450" y="344" width="140" height="64" rx="6" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="520" y="365" font-size="12" text-anchor="middle" font-weight="600" fill="#4338ca">analyst_agent</text>
  <text x="520" y="380" font-size="11" text-anchor="middle" fill="#3730a3">research text in,</text>
  <text x="520" y="395" font-size="11" text-anchor="middle" fill="#3730a3">1 LLM call</text>
  <rect x="600" y="344" width="140" height="64" rx="6" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="670" y="365" font-size="12" text-anchor="middle" font-weight="600" fill="#4338ca">writer_agent</text>
  <text x="670" y="380" font-size="11" text-anchor="middle" fill="#3730a3">research + analysis,</text>
  <text x="670" y="395" font-size="11" text-anchor="middle" fill="#3730a3">1 LLM call</text>
  <polyline points="440,376 448,376" fill="none" stroke="#6b7280" stroke-width="1.8"/>
  <text x="520" y="426" font-size="10.5" text-anchor="middle" fill="#374151">each step's output is appended and passed to later steps</text>
  <rect x="300" y="444" width="440" height="70" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="520" y="468.5" font-size="13" text-anchor="middle" font-weight="600" fill="#15803d">call_llm()  (agents/config.py)</text>
  <text x="520" y="483.5" font-size="11" text-anchor="middle" fill="#166534">one function for every LLM call; LLM_PROVIDER picks the provider</text>
  <text x="520" y="498.5" font-size="11" text-anchor="middle" fill="#166534">default groq; retries on rate limits (Groq, Gemini, Bedrock)</text>
  <polyline points="370,408 370,442" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
  <polyline points="520,408 520,442" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
  <polyline points="670,408 670,442" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
  <polyline points="244,200 298,200" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="271" y="192" font-size="10.5" text-anchor="middle" fill="#374151">run()</text>
  <polyline points="244,283 262,283 262,220 298,220" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- LLM providers -->
  <rect x="800" y="132" width="356" height="214" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="978" y="156" font-size="14.5" text-anchor="middle" font-weight="700" fill="#15803d">LLM providers (pick one)</text>
  <rect x="814" y="166" width="328" height="50" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="978" y="188" font-size="13" text-anchor="middle" font-weight="600" fill="#15803d">Groq (default)</text>
  <text x="978" y="203" font-size="11" text-anchor="middle" fill="#166534">openai/gpt-oss-120b, needs GROQ_API_KEY</text>
  <rect x="814" y="222" width="328" height="50" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="978" y="244" font-size="13" text-anchor="middle" font-weight="600" fill="#15803d">Gemini</text>
  <text x="978" y="259" font-size="11" text-anchor="middle" fill="#166534">gemini-3.6-flash, needs GEMINI_API_KEY</text>
  <rect x="814" y="278" width="328" height="58" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="978" y="296.5" font-size="13" text-anchor="middle" font-weight="600" fill="#15803d">Amazon Bedrock converse()</text>
  <text x="978" y="311.5" font-size="11" text-anchor="middle" fill="#166534">us.anthropic.claude-sonnet-4-6</text>
  <text x="978" y="326.5" font-size="11" text-anchor="middle" fill="#166534">AWS credentials + model access</text>
  <polyline points="740,460 780,460 780,250 798,250" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="786" y="361" font-size="10.5" fill="#374151">LLM</text>

  <!-- Tools (left column) -->
  <rect x="24" y="360" width="220" height="132" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="134" y="384" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0e7490">Tools (tools/)</text>
  <rect x="38" y="394" width="192" height="80" rx="6" fill="#ffffff" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="134" y="416.75" font-size="13" text-anchor="middle" font-weight="600" fill="#0e7490">web_search.py: Tavily</text>
  <text x="134" y="431.25" font-size="10.5" text-anchor="middle" fill="#164e63">needs TAVILY_API_KEY</text>
  <text x="134" y="445.75" font-size="10.5" text-anchor="middle" fill="#164e63">no key: 3 labelled placeholders</text>
  <text x="134" y="460.25" font-size="10.5" text-anchor="middle" fill="#164e63">key set, call fails: raises</text>
  <polyline points="300,376 232,376" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="272" y="368" font-size="10" text-anchor="middle" fill="#374151">search</text>

  <!-- Output (right column) -->
  <rect x="800" y="366" width="356" height="166" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="978" y="390" font-size="14.5" text-anchor="middle" font-weight="700" fill="#334155">Output</text>
  <rect x="814" y="400" width="328" height="54" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="978" y="424" font-size="13" text-anchor="middle" font-weight="600" fill="#334155">final_report</text>
  <text x="978" y="439" font-size="11" text-anchor="middle" fill="#334155">the last writer step, printed or shown in the UI</text>
  <rect x="814" y="462" width="328" height="58" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="978" y="480.5" font-size="13" text-anchor="middle" font-weight="600" fill="#334155">plan, steps, total_time</text>
  <text x="978" y="495.5" font-size="11" text-anchor="middle" fill="#334155">--verbose or the UI checkbox</text>
  <text x="978" y="510.5" font-size="11" text-anchor="middle" fill="#334155">shows each step's output</text>
  <polyline points="760,500 798,500" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="779" y="492" font-size="10" text-anchor="middle" fill="#374151">result</text>

  <!-- Optional: deploy to AWS -->
  <rect x="24" y="556" width="1132" height="290" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="590" y="580" font-size="14.5" text-anchor="middle" font-weight="700" fill="#92400e">Optional: deploy to AWS (deploy/, scripts/)</text>
  <rect x="40" y="594" width="230" height="64" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="155" y="615.5" font-size="13" text-anchor="middle" font-weight="600" fill="#92400e">bash scripts/deploy.sh</text>
  <text x="155" y="630.5" font-size="11" text-anchor="middle" fill="#78350f">agentcore add runtime + deploy</text>
  <text x="155" y="645.5" font-size="11" text-anchor="middle" fill="#78350f">for each of the 4 entry files</text>
  <rect x="40" y="668" width="230" height="64" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="155" y="689.5" font-size="13" text-anchor="middle" font-weight="600" fill="#92400e">agentcore invoke</text>
  <text x="155" y="704.5" font-size="11" text-anchor="middle" fill="#78350f">'{"query": "..."}' calls the</text>
  <text x="155" y="719.5" font-size="11" text-anchor="middle" fill="#78350f">deployed orchestrator</text>
  <rect x="40" y="742" width="230" height="72" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="155" y="761.5" font-size="13" text-anchor="middle" font-weight="600" fill="#92400e">deploy/terraform</text>
  <text x="155" y="776" font-size="10.5" text-anchor="middle" fill="#78350f">IAM runtime role (one, shared)</text>
  <text x="155" y="790.5" font-size="10.5" text-anchor="middle" fill="#78350f">deployer role</text>
  <text x="155" y="805" font-size="10.5" text-anchor="middle" fill="#78350f">log group, 14-day retention</text>
  <rect x="300" y="594" width="560" height="236" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="580" y="618" font-size="13.5" text-anchor="middle" font-weight="600" fill="#4338ca">AgentCore Runtime (deploy/agentcore/*.py)</text>
  <rect x="316" y="630" width="528" height="56" rx="6" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="580" y="655" font-size="13" text-anchor="middle" font-weight="600" fill="#4338ca">orchestrator runtime</text>
  <text x="580" y="670" font-size="11" text-anchor="middle" fill="#3730a3">BedrockAgentCoreApp entrypoint + ping; wraps agents/orchestrator.run()</text>
  <rect x="316" y="748" width="168" height="56" rx="6" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="400" y="773" font-size="12" text-anchor="middle" font-weight="600" fill="#4338ca">research_agent runtime</text>
  <text x="400" y="787" font-size="10" text-anchor="middle" fill="#3730a3">wraps agents/research_agent.py</text>
  <rect x="496" y="748" width="168" height="56" rx="6" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="580" y="773" font-size="12" text-anchor="middle" font-weight="600" fill="#4338ca">analyst_agent runtime</text>
  <text x="580" y="787" font-size="10" text-anchor="middle" fill="#3730a3">wraps agents/analyst_agent.py</text>
  <rect x="676" y="748" width="168" height="56" rx="6" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="760" y="773" font-size="12" text-anchor="middle" font-weight="600" fill="#4338ca">writer_agent runtime</text>
  <text x="760" y="787" font-size="10" text-anchor="middle" fill="#3730a3">wraps agents/writer_agent.py</text>
  <polyline points="580,686 580,746" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="588" y="708" font-size="10.5" fill="#374151">invoke_agent_runtime (bedrock-agentcore),</text>
  <text x="588" y="722" font-size="10.5" fill="#374151">only when AGENT_ARNS is filled in;</text>
  <text x="588" y="736" font-size="10.5" fill="#374151">empty (as shipped): in-process calls</text>
  <polyline points="270,700 292,700 292,658 314,658" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
  <polyline points="270,614 298,614" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="880" y="594" width="260" height="112" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1010" y="625.5" font-size="13" text-anchor="middle" font-weight="600" fill="#4b5563">Not in the code</text>
  <text x="1010" y="640" font-size="10.5" text-anchor="middle" fill="#4b5563">AgentCore Memory</text>
  <text x="1010" y="654.5" font-size="10.5" text-anchor="middle" fill="#4b5563">AgentCore Gateway</text>
  <text x="1010" y="669" font-size="10.5" text-anchor="middle" fill="#4b5563">A2A protocol messages</text>
  <text x="1010" y="683.5" font-size="10.5" text-anchor="middle" fill="#4b5563">(images/architecture.svg shows them)</text>
  <rect x="880" y="718" width="260" height="112" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="1010" y="749.5" font-size="13" text-anchor="middle" font-weight="600" fill="#4b5563">Same code in both modes</text>
  <text x="1010" y="764" font-size="10.5" text-anchor="middle" fill="#4b5563">each runtime imports agents/</text>
  <text x="1010" y="778.5" font-size="10.5" text-anchor="middle" fill="#4b5563">and call_llm(), so</text>
  <text x="1010" y="793" font-size="10.5" text-anchor="middle" fill="#4b5563">LLM_PROVIDER picks the model</text>
  <text x="1010" y="807.5" font-size="10.5" text-anchor="middle" fill="#4b5563">in AWS too</text>
  <polyline points="24,878 54,878" fill="none" stroke="#6b7280" stroke-width="1.8"/>
  <text x="60" y="882" font-size="11" fill="#374151">request flow</text>
  <polyline points="170,878 200,878" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="206" y="882" font-size="11" fill="#374151">conditional or returned data</text>
  <text x="1156" y="882" font-size="11" text-anchor="end" fill="#6b7280">No offline model: a run needs a key for the chosen provider. Tests mock call_llm().</text>
</svg>
