[project]
name = "migration-engineer"
version = "0.1.0"
description = "Autonomous Migration Engineer - a digital employee that upgrades codebases at fleet scale on the Claude Agent SDK harness, with a LangGraph fan-out and a human approval gate"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Rajesh Srivastava", email = "rajsrivastava2@gmail.com"}]
keywords = [
    "ai-agents",
    "claude-agent-sdk",
    "agent-harness",
    "mcp",
    "langgraph",
    "code-migration",
    "digital-employee",
    "human-in-the-loop",
]

dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "python-dotenv>=1.0.0",
    "langgraph>=0.2.0",
]

[project.optional-dependencies]
# The real Claude Agent SDK worker. Optional so the project runs offline (on the
# deterministic stub worker) with zero credentials - see README "Three execution modes".
sdk = [
    "claude-agent-sdk>=0.1.0",
]
# The Gemini live worker (used when no ANTHROPIC_API_KEY is configured but a
# GEMINI_API_KEY / GOOGLE_API_KEY is) - see src/harness/gemini_agent.py.
gemini = [
    "google-genai>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[project.scripts]
migrate = "cli:main"

[tool.ruff]
target-version = "py310"
line-length = 120
# Fixture repos are intentionally "unmigrated" (they contain the deprecated code
# the agent is meant to fix), so they must not be linted as first-party source.
extend-exclude = ["fixtures", ".work"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
