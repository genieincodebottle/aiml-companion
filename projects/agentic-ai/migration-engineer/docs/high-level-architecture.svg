<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <style>
      .band{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1;rx:12}
      .lbl{fill:#64748b;font-size:12px;font-weight:600;letter-spacing:.5px}
      .box{stroke-width:1.5;rx:10}
      .t{font-size:13px;fill:#0f172a}
      .tb{font-size:13px;fill:#0f172a;font-weight:700}
      .ts{font-size:11px;fill:#475569}
      .edge{stroke:#64748b;stroke-width:1.6;fill:none}
      .tw{fill:#ffffff;font-size:13px;font-weight:700}
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="720" fill="#ffffff"/>
  <text x="28" y="34" font-size="20" font-weight="700" fill="#0f172a">Autonomous Migration Engineer - High-Level Architecture</text>
  <text x="28" y="54" font-size="13" fill="#64748b">Digital employee that migrates a fleet of repositories on the Claude Agent SDK harness, supervised by a human.</text>

  <!-- Clients -->
  <rect class="band" x="28" y="74" width="924" height="66" rx="12"/>
  <text class="lbl" x="40" y="94">CLIENTS</text>
  <rect class="box" x="360" y="100" width="120" height="30" fill="#e0edff" stroke="#4f9eff"/>
  <text class="tb" x="420" y="120" text-anchor="middle">React Console</text>
  <rect class="box" x="500" y="100" width="120" height="30" fill="#e0edff" stroke="#4f9eff"/>
  <text class="tb" x="560" y="120" text-anchor="middle">CLI</text>
  <text class="ts" x="636" y="120">REST + SSE (live events)</text>

  <line class="edge" x1="490" y1="140" x2="490" y2="166" marker-end="url(#arrow)"/>

  <!-- API -->
  <rect class="box" x="330" y="166" width="320" height="40" fill="#ede9fe" stroke="#8b5cf6"/>
  <text class="tb" x="490" y="191" text-anchor="middle">FastAPI  (main.py)  -  /api/runs + SSE stream</text>

  <!-- Orchestration band -->
  <rect class="band" x="28" y="224" width="924" height="150" rx="12"/>
  <text class="lbl" x="40" y="244">ORCHESTRATION  -  control plane</text>

  <rect class="box" x="70" y="256" width="360" height="52" fill="#dcfce7" stroke="#22c55e"/>
  <text class="tb" x="250" y="278" text-anchor="middle">MigrationManager  (live, streaming)</text>
  <text class="ts" x="250" y="296" text-anchor="middle">fan-out - SSE - human PR gate - budget roll-up</text>

  <rect class="box" x="550" y="256" width="360" height="52" fill="#fef9c3" stroke="#eab308"/>
  <text class="tb" x="730" y="278" text-anchor="middle">LangGraph StateGraph  (batch / eval)</text>
  <text class="ts" x="730" y="296" text-anchor="middle">plan -&gt; migrate -&gt; review -&gt; gate -&gt; aggregate</text>

  <rect class="box" x="330" y="326" width="320" height="34" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="tb" x="490" y="348" text-anchor="middle">migrate_repo_core()  -  shared per-repo pipeline</text>
  <line class="edge" x1="250" y1="308" x2="440" y2="326" marker-end="url(#arrow)"/>
  <line class="edge" x1="730" y1="308" x2="540" y2="326" marker-end="url(#arrow)"/>

  <!-- Fan-out to repos -->
  <line class="edge" x1="490" y1="360" x2="490" y2="392" marker-end="url(#arrow)"/>
  <text class="ts" x="500" y="382">bounded-concurrency fan-out across the fleet</text>

  <rect class="band" x="28" y="400" width="924" height="300" rx="12"/>
  <text class="lbl" x="40" y="420">DIGITAL EMPLOYEES  -  one Claude Agent SDK worker per repo (isolated worktree)</text>

  <!-- worker cards -->
  <g>
    <rect class="box" x="48" y="432" width="210" height="80" fill="#eff6ff" stroke="#4f9eff"/>
    <text class="tb" x="153" y="454" text-anchor="middle">billing-service</text>
    <text class="ts" x="153" y="472" text-anchor="middle">Claude Agent SDK worker</text>
    <text class="ts" x="153" y="490" text-anchor="middle">observe -&gt; act -&gt; verify loop</text>
    <text class="ts" x="153" y="504" text-anchor="middle">(SDK owns the loop)</text>
  </g>
  <g>
    <rect class="box" x="272" y="432" width="210" height="80" fill="#eff6ff" stroke="#4f9eff"/>
    <text class="tb" x="377" y="454" text-anchor="middle">auth-service</text>
    <text class="ts" x="377" y="472" text-anchor="middle">Claude Agent SDK worker</text>
    <text class="ts" x="377" y="490" text-anchor="middle">edit -&gt; run tests -&gt; iterate</text>
  </g>
  <g>
    <rect class="box" x="496" y="432" width="210" height="80" fill="#eff6ff" stroke="#4f9eff"/>
    <text class="tb" x="601" y="454" text-anchor="middle">analytics-service</text>
    <text class="ts" x="601" y="472" text-anchor="middle">Claude Agent SDK worker</text>
    <text class="ts" x="601" y="490" text-anchor="middle">multi-file migration</text>
  </g>
  <g>
    <rect class="box" x="720" y="432" width="210" height="80" fill="#eff6ff" stroke="#4f9eff"/>
    <text class="tb" x="825" y="454" text-anchor="middle">notifications-service</text>
    <text class="ts" x="825" y="472" text-anchor="middle">Claude Agent SDK worker</text>
    <text class="ts" x="825" y="490" text-anchor="middle">stub stand-in when no key</text>
  </g>

  <!-- shared services -->
  <text class="lbl" x="40" y="540">every tool call routes through one choke point (ToolInvoker): hooks + budget + trace + events</text>
  <rect class="box" x="48" y="552" width="200" height="44" fill="#f0fdfa" stroke="#14b8a6"/>
  <text class="tb" x="148" y="572" text-anchor="middle">In-process MCP tools</text>
  <text class="ts" x="148" y="588" text-anchor="middle">repo - tests - rules(RAG) - memory</text>

  <rect class="box" x="262" y="552" width="200" height="44" fill="#fef2f2" stroke="#ef4444"/>
  <text class="tb" x="362" y="572" text-anchor="middle">Guardrail hooks</text>
  <text class="ts" x="362" y="588" text-anchor="middle">PreToolUse: no tests, no traversal</text>

  <rect class="box" x="476" y="552" width="200" height="44" fill="#fdf4ff" stroke="#d946ef"/>
  <text class="tb" x="576" y="572" text-anchor="middle">Reviewer agent</text>
  <text class="ts" x="576" y="588" text-anchor="middle">tamper gate + second opinion</text>

  <rect class="box" x="690" y="552" width="240" height="44" fill="#fff7ed" stroke="#f97316"/>
  <text class="tb" x="810" y="572" text-anchor="middle">Human PR gate  -&gt;  Open PR</text>
  <text class="ts" x="810" y="588" text-anchor="middle">approve / reject per repo</text>

  <!-- cross-cutting -->
  <rect class="box" x="48" y="620" width="430" height="40" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="tb" x="263" y="644" text-anchor="middle">Observability  -  OTel-shaped trace span per tool call</text>
  <rect class="box" x="500" y="620" width="430" height="40" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="tb" x="715" y="644" text-anchor="middle">Evaluation  -  golden tasks + scorers = CI promotion gate</text>

  <text x="28" y="694" font-size="12" fill="#94a3b8">The SDK owns the per-repo loop; everything else - tools, guardrails, review, fan-out, evals - is the production engineering around it.</text>
</svg>
