<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="a2r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/>
    </marker>
    <style>
      .t{font-size:13px;fill:#0f172a}
      .tb{font-size:13px;fill:#0f172a;font-weight:700}
      .ts{font-size:11px;fill:#475569}
      .edge{stroke:#64748b;stroke-width:1.6;fill:none}
      .edger{stroke:#ef4444;stroke-width:1.6;fill:none}
      .box{stroke-width:1.5;rx:10}
    </style>
  </defs>
  <rect x="0" y="0" width="980" height="640" fill="#ffffff"/>
  <text x="28" y="34" font-size="20" font-weight="700" fill="#0f172a">One Repository's Migration - the Harness Up Close</text>
  <text x="28" y="54" font-size="13" fill="#64748b">The Claude Agent SDK owns the loop. Every tool call passes through one choke point where our policy lives.</text>

  <!-- SDK harness -->
  <rect class="box" x="28" y="80" width="924" height="86" fill="#eff6ff" stroke="#4f9eff"/>
  <text class="tb" x="48" y="106">Claude Agent SDK harness  (the agent loop - NOT written by us)</text>
  <text class="ts" x="48" y="126">gather context  -&gt;  decide next action  -&gt;  call a tool  -&gt;  observe result  -&gt;  verify  -&gt;  repeat, until tests pass or budget hit</text>
  <text class="ts" x="48" y="146">context compaction, tool dispatch, retries, termination = all inherited from the SDK.  In stub mode a deterministic loop honours the same contract.</text>

  <line class="edge" x1="490" y1="166" x2="490" y2="196" marker-end="url(#a2)"/>
  <text class="ts" x="500" y="186">worker wants to call a tool</text>

  <!-- ToolInvoker choke point -->
  <rect class="box" x="230" y="196" width="520" height="52" fill="#f1f5f9" stroke="#334155"/>
  <text class="tb" x="490" y="218" text-anchor="middle">ToolInvoker  -  the single choke point (both modes)</text>
  <text class="ts" x="490" y="236" text-anchor="middle">applies hook -&gt; runs handler -&gt; redacts output -&gt; charges budget -&gt; emits event -&gt; traces</text>

  <!-- PreToolUse hook -->
  <line class="edge" x1="490" y1="248" x2="490" y2="278" marker-end="url(#a2)"/>
  <rect class="box" x="330" y="278" width="320" height="46" fill="#fef2f2" stroke="#ef4444"/>
  <text class="tb" x="490" y="299" text-anchor="middle">PreToolUse guardrail hook</text>
  <text class="ts" x="490" y="315" text-anchor="middle">block test-file writes - block traversal - redact secrets</text>

  <!-- block path -->
  <line class="edger" x1="650" y1="301" x2="820" y2="301" marker-end="url(#a2r)"/>
  <rect class="box" x="820" y="280" width="132" height="44" fill="#fee2e2" stroke="#ef4444"/>
  <text class="tb" x="886" y="300" text-anchor="middle">GUARDRAIL</text>
  <text class="tb" x="886" y="316" text-anchor="middle">_BLOCK event</text>

  <!-- allow -> handler -->
  <line class="edge" x1="490" y1="324" x2="490" y2="352" marker-end="url(#a2)"/>
  <text class="ts" x="500" y="344">allow</text>

  <!-- tools row -->
  <rect class="box" x="60" y="352" width="180" height="60" fill="#f0fdfa" stroke="#14b8a6"/>
  <text class="tb" x="150" y="376" text-anchor="middle">read_file / grep</text>
  <text class="ts" x="150" y="394" text-anchor="middle">list_files</text>
  <text class="ts" x="150" y="408" text-anchor="middle">(read)</text>

  <rect class="box" x="252" y="352" width="180" height="60" fill="#fefce8" stroke="#eab308"/>
  <text class="tb" x="342" y="376" text-anchor="middle">write_file</text>
  <text class="ts" x="342" y="394" text-anchor="middle">(mutating -</text>
  <text class="ts" x="342" y="408" text-anchor="middle">hook-gated)</text>

  <rect class="box" x="444" y="352" width="180" height="60" fill="#eef2ff" stroke="#6366f1"/>
  <text class="tb" x="534" y="376" text-anchor="middle">run_tests</text>
  <text class="ts" x="534" y="394" text-anchor="middle">real subprocess</text>
  <text class="ts" x="534" y="408" text-anchor="middle">(verify)</text>

  <rect class="box" x="636" y="352" width="150" height="60" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text class="tb" x="711" y="376" text-anchor="middle">search_rules</text>
  <text class="ts" x="711" y="394" text-anchor="middle">RAG over</text>
  <text class="ts" x="711" y="408" text-anchor="middle">the rulebook</text>

  <rect class="box" x="798" y="352" width="150" height="60" fill="#fdf4ff" stroke="#d946ef"/>
  <text class="tb" x="873" y="376" text-anchor="middle">memory</text>
  <text class="ts" x="873" y="394" text-anchor="middle">record / recall</text>
  <text class="ts" x="873" y="408" text-anchor="middle">cross-repo</text>

  <!-- budget + events + trace -->
  <line class="edge" x1="490" y1="412" x2="490" y2="442" marker-end="url(#a2)"/>
  <rect class="box" x="60" y="442" width="270" height="48" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="tb" x="195" y="463" text-anchor="middle">Budget ceilings</text>
  <text class="ts" x="195" y="479" text-anchor="middle">steps - tool calls - cost (halts runaways)</text>

  <rect class="box" x="352" y="442" width="270" height="48" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="tb" x="487" y="463" text-anchor="middle">Event stream -&gt; SSE</text>
  <text class="ts" x="487" y="479" text-anchor="middle">tool_call - edit_applied - tests_run</text>

  <rect class="box" x="644" y="442" width="270" height="48" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="tb" x="779" y="463" text-anchor="middle">Trace span (OTel-shaped)</text>
  <text class="ts" x="779" y="479" text-anchor="middle">one per tool call, appended as JSONL</text>

  <!-- outcome -->
  <line class="edge" x1="490" y1="490" x2="490" y2="520" marker-end="url(#a2)"/>
  <rect class="box" x="230" y="520" width="520" height="48" fill="#dcfce7" stroke="#22c55e"/>
  <text class="tb" x="490" y="541" text-anchor="middle">MigrationResult  -&gt;  Reviewer (tamper gate)  -&gt;  Human PR gate  -&gt;  Open PR</text>
  <text class="ts" x="490" y="557" text-anchor="middle">tests_passing - unified diff - files changed - escalate?</text>

  <text x="28" y="600" font-size="12" fill="#94a3b8">Because both the SDK worker and the offline stub call ToolInvoker, guardrails, budget, review, and evals behave identically in either mode.</text>
</svg>
