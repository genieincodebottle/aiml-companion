<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L0,3 L8,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="900" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Mission Control - High-Level Architecture</text>
  <text x="600" y="56" text-anchor="middle" font-size="13" fill="#6b7280">A platform under agents you did not write, proven on a six-agent AML squad. Every model call, tool call and filing passes a platform control.</text>

  <!-- People -->
  <rect x="30" y="74" width="250" height="44" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="155" y="101" text-anchor="middle" font-size="15" font-weight="600" fill="#9a3412">Analysts and reviewers</text>

  <!-- Model providers -->
  <rect x="350" y="68" width="280" height="76" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="366" y="86" font-size="12.5" font-weight="700" fill="#15803d">Model providers</text>
  <text x="614" y="86" text-anchor="end" font-size="10" fill="#15803d">gateway/providers.py</text>
  <rect x="366" y="94" width="120" height="44" rx="6" fill="#ffffff" stroke="#86efac" stroke-dasharray="4 3"/>
  <text x="426" y="111" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">StubProvider</text>
  <text x="426" y="128" text-anchor="middle" font-size="10" fill="#166534">offline, no key</text>
  <rect x="494" y="94" width="120" height="44" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="554" y="111" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">GeminiProvider</text>
  <text x="554" y="128" text-anchor="middle" font-size="10" fill="#166534">premium + cheap tier</text>

  <!-- Entry points -->
  <rect x="30" y="164" width="250" height="496" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">Entry points</text>

  <rect x="46" y="200" width="218" height="168" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="155" y="222" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">React console (Vite)</text>
  <text x="58" y="244" font-size="10.5" fill="#1e3a8a">OperatorBar: who is acting</text>
  <text x="58" y="262" font-size="10.5" fill="#1e3a8a">AlertCatalog: Investigate</text>
  <text x="58" y="280" font-size="10.5" fill="#1e3a8a">Investigation + Timeline:</text>
  <text x="58" y="298" font-size="10.5" fill="#1e3a8a">one case, live</text>
  <text x="58" y="316" font-size="10.5" fill="#1e3a8a">ApprovalGate: approve or</text>
  <text x="58" y="334" font-size="10.5" fill="#1e3a8a">reject, with a note</text>
  <text x="58" y="352" font-size="10.5" fill="#1e3a8a">CaseHistory, AgentRoster</text>

  <rect x="46" y="384" width="218" height="118" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="155" y="406" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">CLI (cli.py)</text>
  <text x="58" y="428" font-size="10.5" fill="#1e3a8a">alerts, agents, cases</text>
  <text x="58" y="446" font-size="10.5" fill="#1e3a8a">run / stream ALRT-001</text>
  <text x="58" y="464" font-size="10.5" fill="#1e3a8a">decide &lt;id&gt; approve --as &lt;name&gt;</text>
  <text x="58" y="482" font-size="10.5" fill="#1e3a8a">prompts: labels, rollback</text>

  <rect x="46" y="518" width="218" height="124" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="155" y="540" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Evaluation (run_eval.py)</text>
  <text x="58" y="562" font-size="10.5" fill="#1e3a8a">every golden alert, scored on</text>
  <text x="58" y="580" font-size="10.5" fill="#1e3a8a">disposition, injection, judge</text>
  <text x="58" y="598" font-size="10.5" fill="#1e3a8a">promotes a candidate prompt</text>
  <text x="58" y="616" font-size="10.5" fill="#1e3a8a">only on a live pass</text>

  <!-- Platform API -->
  <rect x="350" y="164" width="280" height="200" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="490" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#0e7490">Platform API (main.py)</text>
  <rect x="366" y="198" width="248" height="152" rx="6" fill="#ffffff" stroke="#67e8f9"/>
  <text x="378" y="218" font-size="11" fill="#164e63">POST /api/investigations (analyst)</text>
  <text x="378" y="238" font-size="11" fill="#164e63">POST /api/decisions (reviewer)</text>
  <text x="378" y="258" font-size="11" fill="#164e63">GET /api/investigations/{id}/stream</text>
  <text x="378" y="278" font-size="11" fill="#164e63">GET /api/alerts, /agents, /prompts</text>
  <text x="378" y="298" font-size="11" fill="#164e63">GET /api/health (mode, can_run)</text>
  <text x="378" y="318" font-size="11" fill="#164e63">who acts: Bearer token when</text>
  <text x="378" y="338" font-size="11" fill="#164e63">MC_OPERATORS is set, else X-Operator</text>

  <!-- Control plane -->
  <rect x="350" y="388" width="280" height="272" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="366" y="410" font-size="15" font-weight="700" fill="#4338ca">Control plane</text>
  <text x="614" y="410" text-anchor="end" font-size="10" fill="#4338ca">control_plane.py</text>
  <rect x="366" y="424" width="248" height="72" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="378" y="444" font-size="11.5" font-weight="600" fill="#3730a3">AgentRegistry (registry/agents.py)</text>
  <text x="378" y="462" font-size="10.5" fill="#3730a3">six agent cards: role, model tier,</text>
  <text x="378" y="480" font-size="10.5" fill="#3730a3">allowed tools, side-effecting or not</text>
  <rect x="366" y="508" width="248" height="72" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="378" y="528" font-size="11" font-weight="600" fill="#3730a3">PromptRegistry (registry/prompts.py)</text>
  <text x="378" y="546" font-size="10.5" fill="#3730a3">versions with labels: production,</text>
  <text x="378" y="564" font-size="10.5" fill="#3730a3">candidate; rollback moves a label</text>
  <rect x="366" y="592" width="248" height="52" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="378" y="613" font-size="10.5" fill="#3730a3">Builds and wires the gateway, policy</text>
  <text x="378" y="631" font-size="10.5" fill="#3730a3">engine, identity broker and runtime</text>

  <!-- Durable runtime -->
  <rect x="700" y="164" width="470" height="496" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="716" y="186" font-size="15" font-weight="700" fill="#334155">Durable runtime (runtime/engine.py)</text>
  <text x="716" y="207" font-size="11" font-weight="600" fill="#475569">Six-agent AML squad (tenants/fincrime/), run in this order</text>

  <rect x="716" y="216" width="142" height="40" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="787" y="232" text-anchor="middle" font-size="11" font-weight="600" fill="#3730a3">1. fincrime.triage</text>
  <text x="787" y="248" text-anchor="middle" font-size="10" fill="#3730a3">severity, cheap tier</text>
  <rect x="864" y="216" width="142" height="40" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="935" y="232" text-anchor="middle" font-size="11" font-weight="600" fill="#3730a3">2. fincrime.graph</text>
  <text x="935" y="248" text-anchor="middle" font-size="10" fill="#3730a3">entity network, premium</text>
  <rect x="1012" y="216" width="142" height="40" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="1083" y="232" text-anchor="middle" font-size="11" font-weight="600" fill="#3730a3">3. fincrime.screening</text>
  <text x="1083" y="248" text-anchor="middle" font-size="10" fill="#3730a3">watchlists, cheap tier</text>
  <rect x="716" y="262" width="142" height="40" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="787" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#3730a3">4. fincrime.narrative</text>
  <text x="787" y="294" text-anchor="middle" font-size="10" fill="#3730a3">cited SAR draft, premium</text>
  <rect x="864" y="262" width="142" height="40" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="935" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#3730a3">5. fincrime.critic</text>
  <text x="935" y="294" text-anchor="middle" font-size="10" fill="#3730a3">checks the citations</text>
  <rect x="1012" y="262" width="142" height="40" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="1083" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#9a3412">6. fincrime.supervisor</text>
  <text x="1083" y="294" text-anchor="middle" font-size="10" fill="#9a3412">proposes, then commits</text>

  <rect x="716" y="330" width="215" height="80" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="728" y="348" font-size="11.5" font-weight="600" fill="#991b1b">1. Gateway (gateway/core.py)</text>
  <text x="728" y="365" font-size="10" fill="#991b1b">usage limit, PII redaction,</text>
  <text x="728" y="380" font-size="10" fill="#991b1b">tier routing, semantic cache,</text>
  <text x="728" y="395" font-size="10" fill="#991b1b">an audit line for every call</text>
  <rect x="939" y="330" width="215" height="80" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="951" y="348" font-size="11.5" font-weight="600" fill="#991b1b">2. Policy + identity tokens</text>
  <text x="951" y="365" font-size="10" fill="#991b1b">policy/engine.py, identity.py</text>
  <text x="951" y="380" font-size="10" fill="#991b1b">tool not on the card = deny</text>
  <text x="951" y="395" font-size="10" fill="#991b1b">signed, scoped, 300 s tokens</text>

  <rect x="716" y="418" width="215" height="80" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="728" y="436" font-size="11.5" font-weight="600" fill="#9a3412">4. Reviewer gate (engine.py)</text>
  <text x="728" y="453" font-size="10" fill="#9a3412">every disposition parks the</text>
  <text x="728" y="468" font-size="10" fill="#9a3412">case; the opener cannot</text>
  <text x="728" y="483" font-size="10" fill="#9a3412">decide it (maker-checker)</text>
  <rect x="939" y="418" width="215" height="80" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="951" y="436" font-size="11.5" font-weight="600" fill="#991b1b">3. Injection scan</text>
  <text x="951" y="453" font-size="10" fill="#991b1b">guardrails.py checks every</text>
  <text x="951" y="468" font-size="10" fill="#991b1b">tool result before a prompt</text>
  <text x="951" y="483" font-size="10" fill="#991b1b">sees it and neutralises hits</text>

  <rect x="716" y="506" width="215" height="80" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="728" y="524" font-size="11.5" font-weight="600" fill="#1f2937">5. Checkpoints (engine.py)</text>
  <text x="728" y="541" font-size="10" fill="#374151">written after every step by</text>
  <text x="728" y="556" font-size="10" fill="#374151">atomic rename; a resume after</text>
  <text x="728" y="571" font-size="10" fill="#374151">a restart skips finished steps</text>
  <rect x="939" y="506" width="215" height="80" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="951" y="524" font-size="11.5" font-weight="600" fill="#1f2937">Saga + dead-letter queue</text>
  <text x="951" y="541" font-size="10" fill="#374151">saga.py: a failed commit is</text>
  <text x="951" y="556" font-size="10" fill="#374151">compensated; dlq.py parks a</text>
  <text x="951" y="571" font-size="10" fill="#374151">case that hits a ceiling</text>

  <rect x="716" y="596" width="438" height="48" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="728" y="615" font-size="11.5" font-weight="600" fill="#1f2937">Tracer (observability.py)</text>
  <text x="728" y="633" font-size="10" fill="#374151">one trace per case, also across a restart; OpenTelemetry export is optional</text>

  <!-- Stores -->
  <rect x="30" y="694" width="600" height="166" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="46" y="716" font-size="14" font-weight="700" fill="#b45309">Stores (MC_DATA_DIR, default backend/.work)</text>
  <rect x="46" y="730" width="182" height="44" rx="6" fill="#ffffff" stroke="#fcd34d"/>
  <text x="137" y="748" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">checkpoints/&lt;id&gt;.json</text>
  <text x="137" y="764" text-anchor="middle" font-size="10" fill="#92400e">state, finished steps, spend</text>
  <rect x="237" y="730" width="182" height="44" rx="6" fill="#ffffff" stroke="#fcd34d"/>
  <text x="328" y="748" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">events/&lt;id&gt;.jsonl</text>
  <text x="328" y="764" text-anchor="middle" font-size="10" fill="#92400e">the case history</text>
  <rect x="428" y="730" width="182" height="44" rx="6" fill="#ffffff" stroke="#fcd34d"/>
  <text x="519" y="748" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">audit/gateway.jsonl</text>
  <text x="519" y="764" text-anchor="middle" font-size="10" fill="#92400e">one line per model call</text>
  <rect x="46" y="784" width="182" height="44" rx="6" fill="#ffffff" stroke="#fcd34d"/>
  <text x="137" y="802" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">traces/&lt;id&gt;.jsonl</text>
  <text x="137" y="818" text-anchor="middle" font-size="10" fill="#92400e">spans for one case</text>
  <rect x="237" y="784" width="182" height="44" rx="6" fill="#ffffff" stroke="#fcd34d"/>
  <text x="328" y="802" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">dlq/dlq.jsonl</text>
  <text x="328" y="818" text-anchor="middle" font-size="10" fill="#92400e">parked cases and the reason</text>
  <rect x="428" y="784" width="182" height="44" rx="6" fill="#ffffff" stroke="#fcd34d"/>
  <text x="519" y="802" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">prompts.json</text>
  <text x="519" y="818" text-anchor="middle" font-size="10" fill="#92400e">prompt versions and labels</text>
  <text x="46" y="848" font-size="10.5" fill="#92400e">Docker keeps these in the mc-data volume. The semantic cache lives in memory.</text>

  <!-- Tenant tools and data -->
  <rect x="700" y="694" width="470" height="166" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="716" y="716" font-size="14" font-weight="700" fill="#334155">Tenant tools and data (tenants/fincrime/)</text>
  <rect x="716" y="730" width="438" height="48" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="728" y="749" font-size="11.5" font-weight="600" fill="#1f2937">tools.py (FincrimeTools), read-only</text>
  <text x="728" y="767" font-size="10.5" fill="#374151">alert.read, graph.expand, screening.check</text>
  <rect x="716" y="788" width="438" height="58" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="728" y="806" font-size="11.5" font-weight="600" fill="#1f2937">data.py (synthetic)</text>
  <text x="728" y="822" font-size="10.5" fill="#374151">five seed alerts with known answers, an entity graph with</text>
  <text x="728" y="837" font-size="10.5" fill="#374151">sanctions and PEP flags, and notes (ALRT-004's is hostile)</text>

  <!-- People -> entry points -->
  <line x1="155" y1="118" x2="155" y2="162" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Console <-> API -->
  <line x1="266" y1="240" x2="362" y2="240" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315" y="232" text-anchor="middle" font-size="11" fill="#374151">REST</text>
  <line x1="364" y1="330" x2="268" y2="330" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="315" y="348" text-anchor="middle" font-size="11" fill="#374151">SSE</text>

  <!-- API <-> control plane -->
  <line x1="580" y1="352" x2="580" y2="386" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="586" y="380" font-size="10.5" fill="#374151">open, decide</text>
  <line x1="520" y1="422" x2="520" y2="354" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="514" y="380" text-anchor="end" font-size="10.5" fill="#374151">event log</text>

  <!-- CLI and evaluation -> control plane -->
  <line x1="266" y1="440" x2="364" y2="440" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315" y="432" text-anchor="middle" font-size="11" fill="#374151">direct</text>
  <line x1="266" y1="604" x2="364" y2="604" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315" y="596" text-anchor="middle" font-size="11" fill="#374151">evaluate</text>

  <!-- Control plane -> runtime -->
  <line x1="616" y1="470" x2="698" y2="470" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="663" y="450" text-anchor="middle" font-size="10.5" fill="#374151">start,</text>
  <text x="663" y="463" text-anchor="middle" font-size="10.5" fill="#374151">resume</text>

  <!-- Squad -> controls -->
  <line x1="823" y1="302" x2="823" y2="328" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="829" y="320" font-size="10" fill="#374151">call_model</text>
  <line x1="1046" y1="302" x2="1046" y2="328" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1052" y="320" font-size="10" fill="#374151">call_tool</text>

  <!-- Gateway -> model providers -->
  <path d="M716,370 L665,370 L665,106 L632,106" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680" y="240" text-anchor="middle" font-size="10.5" fill="#374151" transform="rotate(-90 680 240)">model calls</text>

  <!-- Policy -> tenant tools -->
  <path d="M1156,370 L1186,370 L1186,754 L1172,754" fill="none" stroke="#6b7280" stroke-width="2" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
  <text x="1194" y="560" text-anchor="middle" font-size="10.5" fill="#374151" transform="rotate(-90 1194 560)">tool calls, results</text>

  <!-- Runtime -> stores -->
  <path d="M760,660 L760,678 L330,678 L330,692" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="545" y="673" text-anchor="middle" font-size="10.5" fill="#374151">checkpoints, events, audit, traces</text>

  <!-- Legend -->
  <line x1="30" y1="882" x2="60" y2="882" stroke="#6b7280" stroke-width="2"/>
  <text x="66" y="886" font-size="11" fill="#374151">request / control flow</text>
  <line x1="220" y1="882" x2="250" y2="882" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="256" y="886" font-size="11" fill="#374151">events, replayed from the log (SSE)</text>
  <text x="1170" y="886" text-anchor="end" font-size="11" fill="#6b7280">With no key, StubProvider answers every model call and every other box runs as shown.</text>
</svg>
