[project]
name = "multi-agent-anatomy"
version = "0.1.0"
description = "An order-support multi-agent system in 8 stages and 5 agents, built to be broken on purpose. No agent framework."
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Rajesh Srivastava" }]
keywords = [
    "multi-agent", "ai-agents", "observability", "distributed-tracing",
    "saga", "prompt-caching", "budget-propagation", "multi-tenancy",
    "failure-injection", "gemini", "fastapi",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    # Live mode only. Replay mode never imports it, which is why the project
    # runs with no key and no account.
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
