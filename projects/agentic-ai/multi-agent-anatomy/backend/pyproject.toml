[project]
name = "multi-agent-anatomy"
version = "0.1.0"
description = "An order-support multi-agent system in 8 stages and 5 agents, built to be broken on purpose. No agent framework."
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Rajesh Srivastava" }]
keywords = [
    "multi-agent", "ai-agents", "observability", "distributed-tracing",
    "saga", "prompt-caching", "budget-propagation", "multi-tenancy",
    "failure-injection", "gemini", "fastapi",
]

dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "python-dotenv>=1.2",
    # Live mode only. Replay mode never imports it, which is why the project
    # runs with no key and no account.
    "google-genai>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "httpx>=0.28",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
