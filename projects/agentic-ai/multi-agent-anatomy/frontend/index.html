<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Multi-Agent Anatomy</title>
    <script>
      // Set the theme before first paint, otherwise a stored dark preference
      // flashes white while React boots. Light is the default.
      try {
        document.documentElement.setAttribute(
          'data-theme',
          localStorage.getItem('theme') === 'dark' ? 'dark' : 'light'
        )
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
